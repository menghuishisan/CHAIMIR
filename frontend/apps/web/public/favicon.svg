<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Chaimir">
  <!--
    A4 favicon:主标志(缺口环 + 环内注册点)的 16px 优化版,透明底 + 玉色描线。
    与 BrandMark 同一几何语言,但笔画 3.2→3.6、缺口 10.2→10.6(v1.9→v1.7 / V21.1→V21.3):
    加粗后同步加宽缺口,让「缺口净宽 减 笔画 = 7.0」这个光学常量保持不变。
    直接把 BrandMark 缩到 16px 会因像素网格取整让缺口忽宽忽窄,故此档单独存一份;
    改主标志几何时本文件必须同步。
    颜色写死是必要例外:favicon 由浏览器在 React 之外加载,取不到 CSS 令牌变量。
    值取自 tokens/theme.css 的 color-accent(jade-400)。
    注:XML 注释内不得出现连续两个连字符,故此处令牌名不带前缀写法。
  -->
  <path d="M26 21.3V23a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1.7"
        fill="none" stroke="#3fd2a8" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20.5" cy="16" r="2.1" fill="#3fd2a8"/>
</svg>
