# 本文件声明 infra/ethereum-beacon 的 Ethereum Beacon API 能力和运行边界。
schema_version: 1
category: infra
name: ethereum-beacon
image: infra/ethereum-beacon
labels:
  app.kubernetes.io/name: ethereum-beacon
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/ethereum-beacon
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Sigma Prime Lighthouse 官方 Beacon Node 镜像。
source:
  type: thin-wrapper
upstream:
  registry: docker.io
  image: sigp/lighthouse
  version: 8.2.2
  digest: sha256:cdb2a6e5eb6197091896b4dac5e607ce696e09355614b56cbe5fb40b1a4dac29
  source_repository: https://github.com/sigp/lighthouse
  license: Apache-2.0
  reuse_policy: thin-wrapper
data_driven: true
capabilities:
  provides:
    - ethereum-beacon-api
    - beacon-node
    - consensus-state
  requires:
    - evm-engine-api
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    required: [testnet_dir, data_dir, checkpoint_state_path, checkpoint_block_path]
    properties:
      testnet_dir:
        type: string
        x-chaimir-env: infra/BEACON_TESTNET_DIR
      data_dir:
        type: string
        x-chaimir-env: infra/BEACON_DATA_DIR
      checkpoint_state_path:
        type: string
        x-chaimir-env: infra/BEACON_CHECKPOINT_STATE_PATH
      checkpoint_block_path:
        type: string
        x-chaimir-env: infra/BEACON_CHECKPOINT_BLOCK_PATH
  student_access: private
infra:
  eco_tags: [evm]
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        env:
          - name: BEACON_TESTNET_DIR
            value: /runtime-state/beacon-testnet
          - name: BEACON_DATA_DIR
            value: /runtime-state/lighthouse
          - name: BEACON_CHECKPOINT_STATE_PATH
            value: /runtime-state/beacon-testnet/genesis.ssz
          - name: BEACON_CHECKPOINT_BLOCK_PATH
            value: /runtime-state/beacon-testnet/genesis-block.ssz
          - name: BEACON_HTTP_PORT
            value: "5052"
        ports:
          - name: http
            container_port: 5052
            service_port: 5052
            protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        read_only_root_filesystem: false
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
        readiness_probe:
          type: http
          path: /eth/v1/node/health
          port: http
          period_seconds: 2
          failure_threshold: 30
    services:
      - name: infra-ethereum-beacon-http
        component: infra
        ports:
          - name: http
            port: 5052
            target_port: http
            protocol: TCP
  bindings:
    - name: execution_chain
      capability: evm-engine-api
      source_component: infra
      endpoint: engine
      protocol: HTTP
      required_at_start: true
      config_binding: env:BEACON_EXECUTION_ENDPOINT
  roles: [beacon, consensus-api-provider]
  command_schema:
    executable: lighthouse
    required_args: [beacon_node, --testnet-dir, --execution-endpoint, --checkpoint-state, --checkpoint-block, --http, --http-address, --http-port]
    forbidden_args: [validator, account]
env_keys:
  config:
    - BEACON_EXECUTION_ENDPOINT
    - BEACON_DATA_DIR
    - BEACON_TESTNET_DIR
    - BEACON_CHECKPOINT_STATE_PATH
    - BEACON_CHECKPOINT_BLOCK_PATH
    - BEACON_HTTP_PORT
  secret:
    - BEACON_EXECUTION_JWT
secrets_required:
  - component: infra
    env: BEACON_EXECUTION_JWT
    secret_key: OP_GETH_JWT_SECRET
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
ports:
  - name: http
    container_port: 5052
    protocol: TCP
    expose: internal
    purpose: Ethereum Beacon REST API
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities: [ALL]
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Beacon 节点需要写数据库、状态和缓存。
    writable_mounts: [runtime-state]
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 8Gi
selftest:
  commands:
    - name: lighthouse-version
      command: [lighthouse, --version]
  upstream_healthcheck:
    type: http
    path: /eth/v1/node/health
    port: 5052
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
build:
  context: images/infra/ethereum-beacon
  dockerfile: Dockerfile
