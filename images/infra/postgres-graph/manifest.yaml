# 本文件声明 infra/postgres-graph 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: postgres-graph
image: infra/postgres-graph
labels:
  app.kubernetes.io/name: postgres-graph
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/postgres-graph
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: The Graph 索引用 PostgreSQL 配套镜像。
source:
  type: thin-wrapper
upstream:
  image: postgres:16-alpine
  version: 16-alpine
  digest: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
  reuse_policy: thin-wrapper
data_driven: true
env_keys:
  config:
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_INITDB_ARGS
  secret:
    - POSTGRES_PASSWORD
secrets_required:
  - env: POSTGRES_PASSWORD
    secret_key: PG_PASSWORD
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
capabilities:
  provides:
    - graph-datastore
    - postgres-compatible
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
infra:
  eco_tags:
    - evm
  roles:
    - datastore
    - indexer-dependency
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        args:
          - -c
          - max_connections=200
        env:
          - name: POSTGRES_DB
            value: graph
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_INITDB_ARGS
            value: --auth-local=scram-sha-256 --auth-host=scram-sha-256 -E UTF8 --locale=C
          - name: PGDATA
            value: /runtime-state/postgres/data
        ports:
          - name: postgres
            container_port: 5432
            service_port: 5432
            protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        readiness_probe:
          type: tcp
          port: postgres
          period_seconds: 2
          failure_threshold: 30
        read_only_root_filesystem: false
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
    services:
      - name: infra-postgres-graph-postgres
        component: infra
        ports:
          - name: postgres
            port: 5432
            target_port: postgres
            protocol: TCP
ports:
  - name: postgres
    container_port: 5432
    protocol: TCP
    expose: internal
    purpose: Graph indexing database
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: PostgreSQL 数据库必须写数据目录;仅允许写入 runtime-state 持久卷。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
resources:
  cpu_request: 250m
  cpu_limit: "1"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 8Gi
build:
  context: images/infra/postgres-graph
  dockerfile: Dockerfile
selftest:
  commands:
    - name: postgres-version
      command:
        - postgres
        - --version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
