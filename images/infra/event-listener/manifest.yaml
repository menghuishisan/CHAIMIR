# 本文件声明 infra/event-listener 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: event-listener
image: infra/event-listener
labels:
  app.kubernetes.io/name: event-listener
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/event-listener
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: 链上事件监听教学服务镜像。
source:
  type: platform-built
upstream:
  image: node:24-alpine3.23
  version: 24-alpine3.23
  digest: sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
  reuse_policy: runtime-base
env_keys:
  config:
    - CHAIMIR_IMAGE_PORT
    - CHAIMIR_HTTP_TIMEOUT_SECONDS
    - CHAIMIR_IMAGE_SERVICE_AUTH_MAX_SKEW_SECONDS
    - CHAIMIR_EVENT_RPC_URL
    - CHAIMIR_EVENT_CONTRACT_ADDRESS
    - CHAIMIR_EVENT_TOPIC
    - CHAIMIR_EVENT_LOOKBACK_BLOCKS
    - CHAIMIR_EVENT_CONFIRMATIONS
    - CHAIMIR_EVENT_MAX_BLOCK_RANGE
    - CHAIMIR_EVENT_MAX_EVENTS
    - CHAIMIR_EVENT_REORG_DEPTH
    - CHAIMIR_EVENT_POLL_INTERVAL_SECONDS
    - CHAIMIR_EVENT_RPC_TIMEOUT_SECONDS
    - CHAIMIR_EVENT_STATE_PATH
  secret:
    - CHAIMIR_EVENT_LISTENER_SERVICE_AUTH_SECRET
secrets_required:
  - component: infra
    env: CHAIMIR_EVENT_LISTENER_SERVICE_AUTH_SECRET
    secret_key: CHAIMIR_EVENT_LISTENER_SERVICE_AUTH_SECRET
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
data_driven: true
capabilities:
  provides:
    - event-listener
  requires:
    - evm-json-rpc
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    required:
      - contract_address
      - event_topic
      - lookback_blocks
    properties:
      contract_address:
        title: 监听合约地址
        type: string
        x-chaimir-env: infra/CHAIMIR_EVENT_CONTRACT_ADDRESS
      event_topic:
        title: 事件主题
        type: string
        x-chaimir-env: infra/CHAIMIR_EVENT_TOPIC
      lookback_blocks:
        title: 回查区块数
        type: integer
        x-chaimir-env: infra/CHAIMIR_EVENT_LOOKBACK_BLOCKS
  student_access: private
infra:
  eco_tags:
    - evm
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        env:
          - name: CHAIMIR_IMAGE_PORT
            value: "8080"
          - name: CHAIMIR_HTTP_TIMEOUT_SECONDS
            value: "30"
          - name: CHAIMIR_IMAGE_SERVICE_AUTH_MAX_SKEW_SECONDS
            value: "300"
          - name: CHAIMIR_EVENT_CONFIRMATIONS
            value: "1"
          - name: CHAIMIR_EVENT_MAX_BLOCK_RANGE
            value: "100"
          - name: CHAIMIR_EVENT_MAX_EVENTS
            value: "256"
          - name: CHAIMIR_EVENT_REORG_DEPTH
            value: "12"
          - name: CHAIMIR_EVENT_POLL_INTERVAL_SECONDS
            value: "2"
          - name: CHAIMIR_EVENT_RPC_TIMEOUT_SECONDS
            value: "10"
          - name: CHAIMIR_EVENT_STATE_PATH
            value: /runtime-state/event-listener/state.json
        ports:
          - name: http
            container_port: 8080
            service_port: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readiness_probe:
          type: http
          path: /healthz
          port: http
          period_seconds: 2
          failure_threshold: 30
        read_only_root_filesystem: true
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
        ephemeral_mounts:
          - name: listener-tmp
            mount_path: /tmp
    services:
      - name: infra-event-listener-http
        component: infra
        ports:
          - name: http
            port: 8080
            target_port: http
            protocol: TCP
  bindings:
    - name: chain
      capability: evm-json-rpc
      source_component: infra
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:CHAIMIR_EVENT_RPC_URL
  roles:
    - event-listener
    - backend-integration
ports:
  - name: http
    container_port: 8080
    protocol: TCP
    expose: internal
    purpose: Event listener API
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
resources:
  cpu_request: 50m
  cpu_limit: 250m
  memory_request: 64Mi
  memory_limit: 256Mi
  ephemeral_storage_limit: 512Mi
build:
  context: images/infra/event-listener
  dockerfile: Dockerfile
selftest:
  commands:
    - name: node-syntax
      command:
        - node
        - --check
        - /app/event-listener.mjs
    - name: auth-required
      command:
        - node
        - -e
        - "const fs=require('fs'); const src=fs.readFileSync('/app/event-listener.mjs','utf8'); if(!src.includes('persistState') || !src.includes('CHAIMIR_EVENT_STATE_PATH') || !src.includes('getLogs') || !src.includes('verifyServiceSignature')) process.exit(1)"
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
