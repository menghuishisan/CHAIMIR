# 本文件声明 infra/ipfs-cluster 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: ipfs-cluster
image: infra/ipfs-cluster
labels:
  app.kubernetes.io/name: ipfs-cluster
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/ipfs-cluster
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: IPFS Cluster 多节点存储协调镜像。
source:
  type: platform-built
upstream:
  source_repo: https://github.com/ipfs-cluster/ipfs-cluster
  source_ref: v1.1.6
  version: v1.1.6
  source_commit: 2182e887ef378f906455784396f1011df968822c
  source_archive: https://codeload.github.com/ipfs-cluster/ipfs-cluster/tar.gz/2182e887ef378f906455784396f1011df968822c
  source_sha256: 5984cc8afe316016b372d50db865b30189f8f8e8d661123ef194dbd1f61c455f
  runtime_image: gcr.io/distroless/static-debian12:nonroot
  runtime_digest: sha256:b7bb25d9f7c31d2bdd1982feb4dafcaf137703c7075dbe2febb41c24212b946f
  build_base_arg: GO_BUILDER_IMAGE
  build_base_image: registry.chaimir.io/base/go-builder
  build_base_digest: sha256:46d92c9696e24102dd211235153b05362a58a9f3d2068a5384f8dde7c1bccfac
  reuse_policy: rebuild-official-release-source
  security_rebuild:
    golang.org/x/crypto: v0.55.0
    golang.org/x/net: v0.58.0
    golang.org/x/text: v0.41.0
    google.golang.org/grpc: v1.83.2
data_driven: true
env_keys:
  config:
    - CHAIMIR_IPFS_API_URL
    - CHAIMIR_IPFS_CLUSTER_TRUSTED_PEERS
  secret:
    - CHAIMIR_IPFS_CLUSTER_SECRET
secrets_required:
  - component: infra
    env: CHAIMIR_IPFS_CLUSTER_SECRET
    secret_key: CHAIMIR_IPFS_CLUSTER_SECRET
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
capabilities:
  provides:
    - decentralized-storage
    - ipfs-cluster
    - ipfs-http-api
  requires:
    - ipfs-node
  conflicts: []
  cardinality: many
  placement: sandbox
  config_schema:
    type: object
    properties:
      trusted_peers:
        title: 信任节点（逗号分隔）
        type: string
        description: 逗号分隔的官方 IPFS Cluster peer ID；留空时仅信任当前官方 identity。
        x-chaimir-env: infra/CHAIMIR_IPFS_CLUSTER_TRUSTED_PEERS
  student_access: private
infra:
  runtime_config_required: true
  eco_tags:
    - evm
    - fabric
    - fisco
    - solana
    - aptos
    - sui
    - cosmos
    - substrate
    - near
    - bitcoin
    - edu
  roles:
    - storage
    - cluster
  bindings:
    - name: ipfs_api
      capability: ipfs-node
      source_component: infra
      endpoint: api
      protocol: HTTP
      required_at_start: true
      config_binding: env:CHAIMIR_IPFS_API_URL
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        ports:
          - name: cluster-api
            container_port: 9094
            service_port: 9094
            protocol: TCP
          - name: api
            container_port: 9095
            service_port: 9095
            protocol: TCP
          - name: cluster
            container_port: 9096
            service_port: 9096
            protocol: TCP
          - name: pin-api
            container_port: 9097
            service_port: 9097
            protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        readiness_probe:
          type: tcp
          port: cluster-api
          period_seconds: 2
          failure_threshold: 30
        read_only_root_filesystem: false
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
    services:
      - name: infra-ipfs-cluster-api
        component: infra
        ports:
          - name: cluster-api
            port: 9094
            target_port: cluster-api
            protocol: TCP
      - name: infra-ipfs-cluster-ipfs-api
        component: infra
        ports:
          - name: api
            port: 9095
            target_port: api
            protocol: TCP
      - name: infra-ipfs-cluster-pin-api
        component: infra
        ports:
          - name: pin-api
            port: 9097
            target_port: pin-api
            protocol: TCP
ports:
  - name: cluster-api
    container_port: 9094
    protocol: TCP
    expose: internal
    purpose: IPFS Cluster API
  - name: api
    container_port: 9095
    protocol: TCP
    expose: internal
    purpose: IPFS-compatible proxy
  - name: cluster
    container_port: 9096
    protocol: TCP
    expose: internal
    purpose: IPFS Cluster peer transport
  - name: pin-api
    container_port: 9097
    protocol: TCP
    expose: internal
    purpose: IPFS Cluster pinning API
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: IPFS Cluster 需要写 peer 状态和 pinset;只允许写入 runtime-state 和受控 Secret 挂载。
    writable_mounts:
      - runtime-state
      - secret
student_access:
  enabled: false
resources:
  cpu_request: 250m
  cpu_limit: "1"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 8Gi
build:
  context: images/infra/ipfs-cluster
  dockerfile: Dockerfile
selftest:
  commands:
    - name: cluster-version
      command:
        - ipfs-cluster-service
        - version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
