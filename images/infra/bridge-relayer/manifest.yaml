# 本文件声明 infra/bridge-relayer 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: bridge-relayer
image: infra/bridge-relayer
labels:
  app.kubernetes.io/name: bridge-relayer
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/bridge-relayer
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: 基于 Hyperlane 官方 agent 的跨链桥中继教学服务镜像。
source:
  type: thin-wrapper
upstream:
  image: ghcr.io/hyperlane-xyz/hyperlane-agent
  version: 2.2.0
  commit: 4da9c4419ad89783fd005e0b776f1fdcd7b59c12
  digest: sha256:ed2a0dcc7ebe7accd2bec88f82ce196bb455f4cf9a4d84d7a9192052b1911551
  reuse_policy: official-thin-wrapper
data_driven: true
capabilities:
  provides:
    - cross-chain-relayer
  requires:
    - evm-json-rpc
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    required:
      - base_config
      - relay_chains
    properties:
      base_config:
        type: string
        minLength: 1
        x-chaimir-env: infra/HYP_BASE_CONFIG
      relay_chains:
        type: string
        minLength: 1
        x-chaimir-env: infra/HYP_RELAYCHAINS
  student_access: private
infra:
  eco_tags:
    - evm
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        env:
          - name: HYP_DB
            value: /runtime-state/hyperlane/db
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        read_only_root_filesystem: true
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
        ephemeral_mounts:
          - name: relayer-tmp
            mount_path: /tmp
  bindings:
    - name: source_chain
      capability: evm-json-rpc
      source_component: infra
      source_endpoint: component
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:HYP_SOURCE_RPC
    - name: destination_chain
      capability: evm-json-rpc
      source_component: infra
      source_endpoint: component
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:HYP_DESTINATION_RPC
  roles:
    - relayer
    - cross-chain
env_keys:
  config:
    - CONFIG_FILES
    - HYP_BASE_CONFIG
    - HYP_DB
    - HYP_RELAYCHAINS
    - HYP_SOURCE_RPC
    - HYP_DESTINATION_RPC
  secret:
    - HYP_DEFAULTSIGNER_KEY
secrets_required:
  - component: infra
    env: HYP_DEFAULTSIGNER_KEY
    secret_key: HYP_DEFAULTSIGNER_KEY
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: writable_mounts
    reason: Hyperlane relayer 的数据库状态写入 runtime-state;含 signer Secret 的配置覆盖文件仅写入临时 /tmp 并限制为 0600,不持久化。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
resources:
  cpu_request: 250m
  cpu_limit: "1"
  memory_request: 256Mi
  memory_limit: 1Gi
  ephemeral_storage_limit: 2Gi
build:
  context: images/infra/bridge-relayer
  dockerfile: Dockerfile
selftest:
  commands:
    - name: hyperlane-relayer-binary
      command:
        - test
        - -x
        - /app/relayer
    - name: config-helper
      command:
        - test
        - -x
        - /usr/local/bin/chaimir-hyperlane-config
    - name: entrypoint-syntax
      command:
        - sh
        - -n
        - /usr/local/bin/chaimir-bridge-relayer-entrypoint
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
