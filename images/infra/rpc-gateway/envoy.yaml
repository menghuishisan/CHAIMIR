# 入口将已校验的组合地址写入原生 Envoy 字段。
static_resources:
  listeners:
    - name: rpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: chaimir_rpc
                route_config:
                  name: rpc_route
                  virtual_hosts:
                    - name: rpc
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: runtime_rpc
                            auto_host_rewrite: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: runtime_rpc
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: runtime_rpc
        endpoints:
          - lb_endpoints:
{{range $index, $target := .}}
              - endpoint:
                  address:
                    socket_address:
                      address: {{quote .Host}}
                      port_value: {{.Port}}
                metadata:
                  filter_metadata:
                    envoy.transport_socket_match:
                      upstream: "node-{{$index}}"
{{end}}
      transport_socket_matches:
{{range $index, $target := .}}
        - name: "node-{{$index}}"
          match:
            upstream: "node-{{$index}}"
          transport_socket:
{{if .TLS}}
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
{{if .SNI}}
              sni: {{quote .SNI}}
{{end}}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/certs/ca-certificates.crt
                  match_typed_subject_alt_names:
                    - san_type: {{.SANType}}
                      matcher:
                        exact: {{quote .Host}}
{{else}}
            name: envoy.transport_sockets.raw_buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
{{end}}
{{end}}
