# 本文件声明 infra/chainlink-node 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: chainlink-node
image: infra/chainlink-node
labels:
  app.kubernetes.io/name: chainlink-node
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/chainlink-node
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Chainlink 预言机节点镜像。
source:
  type: thin-wrapper
upstream:
  image: smartcontract/chainlink:2.61.0
  version: 2.61.0
  digest: sha256:25e67bd3488958e6308772b56d10f117c667a47ecd1df3a68034c56ca77e811e
  source_repository: https://github.com/smartcontractkit/chainlink
  source_commit: d09b59c7d76822bd0238a9bb07054cc6f973d724
  source_archive: https://github.com/smartcontractkit/chainlink/archive/d09b59c7d76822bd0238a9bb07054cc6f973d724.tar.gz
  source_sha256: 183f078af9fd61df59d2a6ca6f06e24bae05c18a397f4c90b36bc07192e8649a
  builder_image: golang:1.26.6-bookworm
  builder_digest: sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
  dependency_overrides:
    golang.org/x/mod: v0.40.0
  reuse_policy: source-rebuild
env_keys:
  config:
    - ETH_URL
  secret: []
data_driven: true
capabilities:
  provides:
    - oracle-service
    - chainlink-node
  requires:
    - evm-json-rpc
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
infra:
  eco_tags:
    - evm
  bindings:
    - name: execution_chain
      capability: evm-json-rpc
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:ETH_URL
  roles:
    - oracle
    - vrf
    - automation
ports:
  - name: http
    container_port: 6688
    protocol: TCP
    expose: internal
    purpose: Chainlink node API
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Chainlink 节点需要写运行状态、密钥库引用和日志缓存;只允许写入 runtime-state 和受控 Secret 挂载。
    writable_mounts:
      - runtime-state
      - secret
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 3Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/infra/chainlink-node
  dockerfile: Dockerfile
selftest:
  commands:
    - name: chainlink-version
      command:
        - chainlink
        - --version
supply_chain:
  deployable: true
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
