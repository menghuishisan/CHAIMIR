# 本文件声明 infra/chainlink-node 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: chainlink-node
image: infra/chainlink-node
labels:
  app.kubernetes.io/name: chainlink-node
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/chainlink-node
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Chainlink 预言机节点镜像。
source:
  type: thin-wrapper
upstream:
  image: smartcontract/chainlink:2.58.0
  digest: sha256:56e653e0ef43759e7e1fe24bbd7b29db7de53ca7a86a99aa949e9fa9ff4813ca
  reuse_policy: thin-wrapper
data_driven: true
capabilities:
  - oracle-service
  - chainlink-node
infra:
  eco_tags:
    - evm
  roles:
    - oracle
    - vrf
    - automation
ports:
  - name: http
    container_port: 6688
    protocol: TCP
    expose: internal
    purpose: Chainlink node API
local_dev:
  host_mappings:
    - host: 127.0.0.1
      env: CHAIMIR_DEV_CHAINLINK_PORT
      default: 16688
      container_port: 6688
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Chainlink 节点需要写运行状态、密钥库引用和日志缓存;只允许写入 runtime-state 和受控 Secret 挂载。
    writable_mounts:
      - runtime-state
      - secret
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 3Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/infra/chainlink-node
  dockerfile: Dockerfile
selftest:
  commands:
    - name: chainlink-version
      command:
        - chainlink
        - --version
supply_chain:
  deployable: false
  block_reason: "官方 smartcontract/chainlink:2.58.0 amd64 digest 已完成拉取,但主 chainlink 二进制仍命中 Go 标准库 HIGH;在上游发布 Go 修复版本或完成可验证源码重建、HIGH/CRITICAL 扫描、Cosign 签名证明并写入正式 digest lock 前不得部署。"
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest_in_production: true
