# 本文件声明 External Secrets Operator 固定上游镜像及其集群密钥同步权限边界。
schema_version: 1
category: infra
name: external-secrets
image: infra/external-secrets
labels:
  app.kubernetes.io/name: external-secrets
  app.kubernetes.io/component: secrets-operator
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/external-secrets
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: secrets-control-plane
  chaimir.io/scope: cluster
  chaimir.io/source: thin-wrapper
description: External Secrets Operator 密钥同步控制器。
source:
  type: thin-wrapper
upstream:
  registry: ghcr.io
  image: external-secrets/external-secrets
  version: v2.10.0
  digest: sha256:814117b0fd6d121b03e8ba3b6db1cecbe7449a354fc0fc9c4faf73a37aa221b1
  source_archive: https://github.com/external-secrets/external-secrets/archive/refs/tags/v2.10.0.tar.gz
  source_sha256: a0c8834a9ecc7b98b5107f748a48a40189ff7a16e5b7033418e9b89992a159df
  builder_image: golang:1.26.6-bookworm
  builder_digest: sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
  runtime_image: gcr.io/distroless/static
  runtime_digest: sha256:f2ea2709ac8db56323cbd7d014277f32cb572d9ea124b0076f7aafe5980678fe
  dependency_overrides:
    golang.org/x/net: v0.57.0
    golang.org/x/text: v0.41.0
    golang.org/x/crypto: v0.55.0
  reuse_policy: fixed-source-rebuild
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: infra
build:
  context: images/infra/external-secrets
  dockerfile: Dockerfile
data_driven: false
capabilities:
  provides:
    - external-secret-reconciliation
    - secret-store-integration
  requires: []
  conflicts: []
  cardinality: one
  placement: cluster
  config_schema: {}
  student_access: private
env_keys:
  config: []
  secret: []
secrets_required: []
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: true
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: automount_service_account_token
    reason: 控制器必须通过专用 RBAC 读取 ExternalSecret、SecretStore 并写入目标 Secret。
student_access:
  enabled: false
data_volumes: []
backup:
  required: false
  mode: declarative-config-only
network:
  expose: internal
  default_deny: true
resources:
  cpu_request: 50m
  cpu_limit: 500m
  memory_request: 64Mi
  memory_limit: 256Mi
  ephemeral_storage_limit: 128Mi
selftest:
  commands:
    - name: help
      command:
        - /bin/external-secrets
        - --help
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
