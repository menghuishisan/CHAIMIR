# 本文件声明 infra/wallet-backend 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: wallet-backend
image: infra/wallet-backend
labels:
  app.kubernetes.io/name: wallet-backend
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/wallet-backend
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: DApp 登录和签名教学钱包后端镜像。
source:
  type: platform-built
upstream:
  image: node:24-alpine3.23
  version: 24-alpine3.23
  digest: sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
  reuse_policy: runtime-base
env_keys:
  config:
    - CHAIMIR_IMAGE_PORT
    - CHAIMIR_HTTP_TIMEOUT_SECONDS
    - CHAIMIR_MAX_BODY_BYTES
    - CHAIMIR_IMAGE_SERVICE_AUTH_MAX_SKEW_SECONDS
    - CHAIMIR_WALLET_ALLOWED_DOMAINS
    - CHAIMIR_WALLET_CHALLENGE_TTL_SECONDS
    - CHAIMIR_WALLET_MAX_CHALLENGES
    - CHAIMIR_WALLET_STATE_PATH
  secret:
    - CHAIMIR_WALLET_SESSION_SECRET
secrets_required:
  - component: infra
    env: CHAIMIR_WALLET_SESSION_SECRET
    secret_key: CHAIMIR_WALLET_SESSION_SECRET
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
data_driven: true
capabilities:
  provides:
    - wallet-backend
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    required:
      - allowed_domains
    properties:
      allowed_domains:
        title: 允许的网站域名（逗号分隔）
        type: string
        x-chaimir-env: infra/CHAIMIR_WALLET_ALLOWED_DOMAINS
  student_access: private
infra:
  eco_tags:
    - evm
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        env:
          - name: CHAIMIR_IMAGE_PORT
            value: "8080"
          - name: CHAIMIR_HTTP_TIMEOUT_SECONDS
            value: "30"
          - name: CHAIMIR_IMAGE_SERVICE_AUTH_MAX_SKEW_SECONDS
            value: "300"
          - name: CHAIMIR_MAX_BODY_BYTES
            value: "1048576"
          - name: CHAIMIR_WALLET_CHALLENGE_TTL_SECONDS
            value: "300"
          - name: CHAIMIR_WALLET_MAX_CHALLENGES
            value: "4096"
          - name: CHAIMIR_WALLET_STATE_PATH
            value: /runtime-state/wallet-backend/challenges.json
        ports:
          - name: http
            container_port: 8080
            service_port: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readiness_probe:
          type: http
          path: /healthz
          port: http
          period_seconds: 2
          failure_threshold: 30
        read_only_root_filesystem: true
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
        ephemeral_mounts:
          - name: wallet-tmp
            mount_path: /tmp
    services:
      - name: infra-wallet-backend-http
        component: infra
        ports:
          - name: http
            port: 8080
            target_port: http
            protocol: TCP
  roles:
    - wallet
    - signing-teaching
ports:
  - name: http
    container_port: 8080
    protocol: TCP
    expose: internal
    purpose: Wallet backend API
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
resources:
  cpu_request: 50m
  cpu_limit: 250m
  memory_request: 64Mi
  memory_limit: 256Mi
  ephemeral_storage_limit: 512Mi
build:
  context: images/infra/wallet-backend
  dockerfile: Dockerfile
selftest:
  commands:
    - name: node-syntax
      command:
        - node
        - --check
        - /app/wallet-backend.mjs
    - name: auth-required
      command:
        - node
        - -e
        - "const fs=require('fs'); const src=fs.readFileSync('/app/wallet-backend.mjs','utf8'); if(!src.includes('verifyServiceSignature') || !src.includes('ethers.verifyMessage') || !src.includes('challengeTtlSeconds') || !src.includes('persistState') || !src.includes('runtime-state')) process.exit(1)"
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
