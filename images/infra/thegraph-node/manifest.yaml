# 本文件声明 infra/thegraph-node 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: thegraph-node
image: infra/thegraph-node
labels:
  app.kubernetes.io/name: thegraph-node
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/thegraph-node
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: The Graph subgraph 索引节点镜像。
source:
  type: thin-wrapper
upstream:
  image: graphprotocol/graph-node:0.44.0
  version: "0.44.0"
  digest: sha256:c14c6d8e2b2b1ed89f6a89babf48d807b18a43e372fda7fb495d3a9050b65b8b
  runtime: gcr.io/distroless/cc-debian12:nonroot
  runtime_digest: sha256:777e96cf322c46bc32aca926c263624c4dc8d7cf37e2fa65ba2c7e697318ebbb
  build_bases:
    - image: registry.chaimir.io/base/go-builder
      digest: sha256:fb0a1352643623882f008691aaa1459262c0c5e1030878dbdbc5e916a852a869
      role: entrypoint-builder
    - image: docker.io/library/alpine
      digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
      role: runtime-state-stage
  reuse_policy: thin-wrapper
data_driven: true
env_keys:
  config:
    - CHAIMIR_GRAPH_RPC_URL
    - CHAIMIR_GRAPH_POSTGRES_ADDRESS
    - CHAIMIR_GRAPH_POSTGRES_DB
    - CHAIMIR_GRAPH_POSTGRES_USER
    - CHAIMIR_GRAPH_IPFS_ADDRESS
    - CHAIMIR_GRAPH_NETWORK
  secret:
    - POSTGRES_PASSWORD
secrets_required:
  - env: POSTGRES_PASSWORD
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
capabilities:
  provides:
    - chain-indexer
    - subgraph-runner
  requires:
    - evm-json-rpc
    - graph-datastore
    - ipfs-http-api
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    properties:
      network_name:
        type: string
        x-chaimir-env: infra/CHAIMIR_GRAPH_NETWORK
      postgres_database:
        type: string
        x-chaimir-env: infra/CHAIMIR_GRAPH_POSTGRES_DB
      postgres_user:
        type: string
        x-chaimir-env: infra/CHAIMIR_GRAPH_POSTGRES_USER
  student_access: private
infra:
  eco_tags:
    - evm
  bindings:
    - name: chain_rpc
      capability: evm-json-rpc
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:CHAIMIR_GRAPH_RPC_URL
    - name: graph_database
      capability: graph-datastore
      endpoint: postgres
      protocol: TCP
      required_at_start: true
      config_binding: env:CHAIMIR_GRAPH_POSTGRES_ADDRESS
    - name: content_store
      capability: ipfs-http-api
      endpoint: api
      protocol: HTTP
      required_at_start: true
      config_binding: env:CHAIMIR_GRAPH_IPFS_ADDRESS
  roles:
    - indexer
    - subgraph
ports:
  - name: graphql
    container_port: 8000
    protocol: TCP
    expose: proxy
    purpose: GraphQL query API
  - name: admin
    container_port: 8020
    protocol: TCP
    expose: internal
    purpose: Subgraph deploy API
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: graph-node 上游服务需要写运行缓存;索引数据必须写入 postgres-graph 或受控数据库。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 8Gi
build:
  context: images/infra/thegraph-node
  dockerfile: Dockerfile
selftest:
  commands:
    - name: graph-node-version
      command:
        - graph-node
        - --version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
