# 本文件声明 infra/op-stack 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: infra
name: op-stack
image: infra/op-stack
labels:
  app.kubernetes.io/name: op-stack
  app.kubernetes.io/component: infra
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: infra
  chaimir.io/image: infra/op-stack
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: sandbox-infra
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Optimism 风格 L2 教学编排镜像。
source:
  type: thin-wrapper
upstream:
  repository: https://github.com/ethereum-optimism/optimism
  version: v1.19.2
  source_commit: da197e45ed44b9fca258b3b0d0709e8dfca1c7cd
  source_archive: https://github.com/ethereum-optimism/optimism/archive/da197e45ed44b9fca258b3b0d0709e8dfca1c7cd.tar.gz
  source_sha256: 0ff5ab74e76b35f0225c6e417ec9fae1025fff46e104a77341593919ae4d17de
  superchain_registry_commit: d84b53b7ee008f863c1d3bbb49e06f713f713978
  superchain_registry_archive: https://github.com/ethereum-optimism/superchain-registry/archive/d84b53b7ee008f863c1d3bbb49e06f713f713978.tar.gz
  superchain_registry_sha256: 08600ee12e2d8933275813e4ef74e30929f95c249f6bce714c9c337527c20d4c
  yq_version: v4.44.3
  yq_source_url: https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
  yq_source_sha256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
  rebuild_policy: source-rebuild
  security_overrides:
    github.com/libp2p/go-libp2p: v0.39.1
    github.com/quic-go/quic-go: v0.49.1
    github.com/pion/interceptor: v0.1.39
env_keys:
  config:
    - OP_NODE_L1_ETH_RPC
    - OP_NODE_L2_ENGINE_RPC
    - OP_NODE_L1_BEACON
    - OP_NODE_ROLLUP_CONFIG
    - OP_NODE_ROLLUP_L1_CHAIN_CONFIG
    - OP_NODE_RPC_ADDR
    - OP_NODE_RPC_PORT
    - OP_NODE_P2P_DISABLE
    - OP_NODE_SEQUENCER_ENABLED
    - OP_NODE_SEQUENCER_L1_CONFS
  secret:
    - OP_GETH_JWT_SECRET
secrets_required:
  - component: infra
    env: OP_GETH_JWT_SECRET
    secret_key: OP_GETH_JWT_SECRET
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
data_driven: true
capabilities:
  provides:
    - l2-stack
  requires:
    - evm-json-rpc
    - evm-engine-api
    - ethereum-beacon-api
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    # Beacon 地址由声明的 l1_beacon link 生成;路径类材料仍必须由组合显式提供。
    required: [rollup_config, l1_chain_config]
    properties:
      rollup_config:
        type: string
        x-chaimir-env: infra/OP_NODE_ROLLUP_CONFIG
      l1_chain_config:
        type: string
        x-chaimir-env: infra/OP_NODE_ROLLUP_L1_CHAIN_CONFIG
      l1_beacon:
        type: string
        x-chaimir-env: infra/OP_NODE_L1_BEACON
      rpc_addr:
        type: string
        x-chaimir-env: infra/OP_NODE_RPC_ADDR
      rpc_port:
        type: integer
        x-chaimir-env: infra/OP_NODE_RPC_PORT
      p2p_disable:
        type: boolean
        x-chaimir-env: infra/OP_NODE_P2P_DISABLE
      sequencer_enabled:
        type: boolean
        x-chaimir-env: infra/OP_NODE_SEQUENCER_ENABLED
      sequencer_l1_confs:
        type: integer
        minimum: 0
        x-chaimir-env: infra/OP_NODE_SEQUENCER_L1_CONFS
  student_access: private
infra:
  runtime_config_required: true
  eco_tags:
    - evm
  resource_spec:
    components:
      - name: infra
        image_url: "@self"
        env:
          - name: OP_NODE_RPC_ADDR
            value: 0.0.0.0
          - name: OP_NODE_RPC_PORT
            value: "8545"
          - name: OP_NODE_P2P_DISABLE
            value: "true"
        ports:
          - name: http
            container_port: 8545
            service_port: 8545
            protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        read_only_root_filesystem: true
        mount_workspace: false
        mount_domains:
          - runtime-state
        writable_mount_domains:
          - runtime-state
        readiness_probe:
          type: tcp
          port: http
          period_seconds: 2
          failure_threshold: 30
    services:
      - name: infra-op-stack-http
        component: infra
        ports:
          - name: http
            port: 8545
            target_port: http
            protocol: TCP
  bindings:
    - name: l1_execution
      capability: evm-json-rpc
      source_component: infra
      endpoint: rpc
      protocol: HTTP
      required_at_start: true
      config_binding: env:OP_NODE_L1_ETH_RPC
    - name: l2_engine
      capability: evm-engine-api
      source_component: infra
      endpoint: engine
      protocol: HTTP
      required_at_start: true
      config_binding: env:OP_NODE_L2_ENGINE_RPC
    - name: l1_beacon
      capability: ethereum-beacon-api
      source_component: infra
      endpoint: http
      protocol: HTTP
      required_at_start: true
      config_binding: env:OP_NODE_L1_BEACON
  roles:
    - l2
    - rollup
ports:
  - name: http
    container_port: 8545
    protocol: TCP
    expose: internal
    purpose: OP Stack RPC
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: writable_mounts
    reason: OP Node 需要在运行期把组合注入的 JWT Secret 写入临时文件;只允许写入 runtime-state,不写入镜像或工作区。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
resources:
  cpu_request: 50m
  cpu_limit: 250m
  memory_request: 64Mi
  memory_limit: 256Mi
  ephemeral_storage_limit: 512Mi
build:
  context: images/infra/op-stack
  dockerfile: Dockerfile
selftest:
  commands:
    - name: op-node-version
      command:
        - op-node
        - --version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
