# 本文件声明 tool/fabric-explorer 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: tool
name: fabric-explorer
image: tool/fabric-explorer
labels:
  app.kubernetes.io/name: fabric-explorer
  app.kubernetes.io/component: tool
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: tool
  chaimir.io/image: tool/fabric-explorer
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "true"
  chaimir.io/sensitivity: student-tool
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: Fabric 区块链浏览器镜像。
source:
  type: platform-built
upstream:
  repository: https://github.com/hyperledger/fabric
  version: v2.5.16
  runtime: alpine:3.23
  runtime_digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
  reuse_policy: native-cli-wrapper
env_keys:
  config:
    - CORE_PEER_ADDRESS
    - CHAIMIR_FABRIC_ORDERER_ADDRESS
    - CHAIMIR_FABRIC_EXPLORER_PORT
  secret: []
data_driven: true
capabilities:
  provides:
    - chain-explorer
    - fabric-browser
  requires:
    - fabric-peer-orderer
    - fabric-crypto-identity
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: public
tool:
  kind: web-embed
  eco_tags:
    - fabric
  mount_workspace: false
  runtime_config_required: true
  bindings:
    - name: peer
      capability: fabric-peer-orderer
      endpoint: peer
      protocol: GRPC
      required_at_start: true
      config_binding: env:CORE_PEER_ADDRESS
    - name: orderer
      capability: fabric-peer-orderer
      endpoint: orderer
      protocol: GRPC
      required_at_start: true
      config_binding: env:CHAIMIR_FABRIC_ORDERER_ADDRESS
  resource_spec:
    components:
      - name: web
        image_url: "@self"
        env:
          - name: FABRIC_CFG_PATH
            value: /runtime-state/fabric/config
          - name: CORE_PEER_LOCALMSPID
            value: Org1MSP
          - name: CORE_PEER_MSPCONFIGPATH
            value: /runtime-state/fabric/crypto/peerOrganizations/org1.chaimir.local/users/Admin@org1.chaimir.local/msp
          - name: CORE_PEER_TLS_ENABLED
            value: "false"
        ports:
          - name: http
            container_port: 8080
            service_port: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        readiness_probe:
          type: http
          path: /
          port: http
          period_seconds: 2
          failure_threshold: 60
        read_only_root_filesystem: true
        mount_workspace: false
        mount_domains:
          - runtime-state
        ephemeral_mounts:
          - name: tmp
            mount_path: /tmp
    services:
      - name: tool-fabric-explorer-web
        component: web
        ports:
          - name: http
            port: 8080
            target_port: http
            protocol: TCP
    routes:
      - path_prefix: /
        service: tool-fabric-explorer-web
        port: http
ports:
  - name: http
    container_port: 8080
    protocol: TCP
    expose: proxy
    purpose: Fabric explorer web UI
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: true
  shell: restricted
  allowed_mounts:
    - public-assets
resources:
  cpu_request: 250m
  cpu_limit: "1"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 2Gi
build:
  context: images/tool/fabric-explorer
  dockerfile: Dockerfile
selftest:
  commands:
    - name: explorer-layout
      command:
        - peer
        - version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
