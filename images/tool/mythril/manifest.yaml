# 本文件声明 tool/mythril 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: tool
name: mythril
image: tool/mythril
labels:
  app.kubernetes.io/name: mythril
  app.kubernetes.io/component: tool
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: tool
  chaimir.io/image: tool/mythril
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "true"
  chaimir.io/sensitivity: student-tool
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: Mythril 符号执行漏洞检测工具镜像。
source:
  type: platform-built
upstream:
  package: mythril
  version: "0.24.8"
  binaries:
    - solc 0.8.20 at /usr/local/bin/solc-0.8.20
    - solc 0.8.24 at /usr/local/bin/solc-0.8.24
    - solc 0.8.26 at /usr/local/bin/solc-0.8.26
  source_repository: https://github.com/ConsenSysDiligence/mythril
  runtime: cgr.dev/chainguard/wolfi-base
  runtime_version: "2026-08-26"
  runtime_digest: sha256:6677ae802613d558c16d8bbb2ef2ec89e2e33089bbf78c8f3090ac159bf02d4c
  runtime_packages:
    - python-3.10=3.10.21-r6
  reuse_policy: pypi-source-build
data_driven: true
toolchain:
  language: solidity
  manager: py-solc-x
  selection_env: SOLCX_BINARY_PATH
  offline: true
  compiler_versions:
    - version: 0.8.20
      executable: /usr/local/bin/solc-0.8.20
      managed_executable: /opt/solcx/solc-v0.8.20
    - version: 0.8.24
      executable: /usr/local/bin/solc-0.8.24
      managed_executable: /opt/solcx/solc-v0.8.24
    - version: 0.8.26
      executable: /usr/local/bin/solc-0.8.26
      managed_executable: /opt/solcx/solc-v0.8.26
capabilities:
  provides:
    - security-scan
    - symbolic-execution
    - solc-compile
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema:
    type: object
    additionalProperties: false
    properties:
      solidity_version:
        type: string
        enum:
          - 0.8.20
          - 0.8.24
          - 0.8.26
        x-chaimir-env: SOLIDITY_VERSION
    required:
      - solidity_version
  student_access: public
tool:
  kind: command-tool
  eco_tags:
    - evm
  mount_workspace: true
  keepalive_command:
    - sleep
    - "2147483647"
  command_policy:
    allowed_argv:
      - ["chaimir-mythril"]
    default_timeout_seconds: 120
    max_timeout_seconds: 300
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Mythril 符号执行需要写临时缓存和分析结果;仅允许写入 workspace 与工具缓存卷。
    writable_mounts:
      - workspace
      - tool-cache
student_access:
  enabled: true
  shell: restricted
  allowed_mounts:
    - workspace
    - public-assets
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/tool/mythril
  dockerfile: Dockerfile
selftest:
  commands:
    - name: myth-version
      command:
        - sh
        - -lc
        - 'set -eu; for version in 0.8.20 0.8.24 0.8.26; do case "$(/usr/local/bin/solc-${version} --version)" in *"Version: ${version}"*) ;; *) exit 1 ;; esac; done; SOLCX_BINARY_PATH=/opt/solcx /opt/mythril/bin/python -c "import solcx; assert {str(v) for v in solcx.get_installed_solc_versions()} == {\"0.8.20\",\"0.8.24\",\"0.8.26\"}"; /opt/mythril/bin/myth version; test -x /usr/local/bin/chaimir-mythril'
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
