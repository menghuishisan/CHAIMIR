# 本文件声明 ZK 命令工具的执行、隔离和供应链契约。
schema_version: 1
category: tool
name: zk-prover
image: tool/zk-prover
labels:
  app.kubernetes.io/name: zk-prover
  app.kubernetes.io/component: tool
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: tool
  chaimir.io/image: tool/zk-prover
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "true"
  chaimir.io/sensitivity: student-tool
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: ZK rollup 证明器教学镜像。
source:
  type: platform-built
upstream:
  image: node:24-alpine3.23
  version: 24-alpine3.23
  digest: sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
  reuse_policy: self-developed-toolchain
  runtime_packages:
    - libcrypto3=3.5.8-r0
    - libssl3=3.5.8-r0
data_driven: true
capabilities:
  provides:
    - zk-prover
    - proof-generation
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: public
tool:
  kind: command-tool
  eco_tags:
    - evm
  mount_workspace: true
  keepalive_command: [sleep, "2147483647"]
  command_policy:
    allowed_argv:
      - [node, /opt/chaimir/zk-prover/run.mjs]
    default_timeout_seconds: 60
    max_timeout_seconds: 180
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: true
  shell: restricted
  allowed_mounts:
    - workspace
resources:
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 128Mi
  memory_limit: 512Mi
  ephemeral_storage_limit: 512Mi
build:
  context: images/tool/zk-prover
  dockerfile: Dockerfile
selftest:
  commands:
    - name: circom-version
      command:
        - /opt/chaimir/zk-prover/node_modules/.bin/circom2
        - --version
    - name: snarkjs-powersoftau
      command:
        - sh
        - -lc
        - tmp=$(mktemp -d); cd "$tmp"; /opt/chaimir/zk-prover/node_modules/.bin/snarkjs powersoftau new bn128 2 pot.ptau
    - name: dispatcher-syntax
      command:
        - node
        - --check
        - /opt/chaimir/zk-prover/run.mjs
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
