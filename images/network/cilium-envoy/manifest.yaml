# 本文件声明 Cilium Envoy 薄封装镜像的来源、运行边界与供应链门禁。
schema_version: 1
category: network
name: cilium-envoy
image: network/cilium-envoy
labels:
  app.kubernetes.io/name: cilium-envoy
  app.kubernetes.io/component: cni-l7-proxy
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium-envoy
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: cluster-network-proxy
  chaimir.io/scope: system
  chaimir.io/source: thin-wrapper
description: Cilium v1.20.0 Chart 使用的 Envoy L7 数据面薄封装镜像。
source:
  type: thin-wrapper
upstream:
  registry: quay.io
  image: cilium/cilium-envoy
  version: v1.37.5-1782911245-7cffc778c923f68a77954a53b1a98d6b5353f004
  digest: sha256:583057dd4f7d54cd41efff3c413aa0b148ac201f522e2c3336851fa89c78b039
  reuse_policy: security-thin-wrapper
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cilium-l7-proxy
ports:
  - name: health
    container_port: 9878
    protocol: TCP
    expose: internal
    purpose: Cilium Envoy health endpoint
local_dev:
  host_mappings: []
security:
  run_as_non_root: false
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  add_capabilities:
    - NET_ADMIN
  network_policy: system-component
security_exceptions:
  - field: run_as_non_root
    reason: 上游 cilium-envoy-starter 以 root 启动后主动丢弃能力，Chart 仅授予 L7 透明代理所需最小能力。
student_access:
  enabled: false
resources:
  cpu_request: 100m
  cpu_limit: "1"
  memory_request: 128Mi
  memory_limit: 512Mi
  ephemeral_storage_limit: 512Mi
selftest:
  commands:
    - name: envoy-version
      command:
        - /usr/bin/cilium-envoy
        - --version
build:
  context: images/network/cilium-envoy
  dockerfile: Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest_in_production: true
