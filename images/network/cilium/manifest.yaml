# 本文件声明 Cilium agent 的系统权限例外与供应链门禁。
schema_version: 1
category: network
name: cilium
image: network/cilium
labels:
  app.kubernetes.io/name: cilium
  app.kubernetes.io/component: cni-agent
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: cluster-network-agent
  chaimir.io/scope: system
  chaimir.io/source: platform-built
description: Cilium v1.20.1 节点 CNI agent 安全重建镜像。
source:
  type: platform-built
upstream:
  source_repository: https://github.com/cilium/cilium
  version: v1.20.1
  source_commit: 7d68cfb394f2960e10aa72e76d0d51e66c1b2ebc
  builder_arg: CILIUM_BUILDER_IMAGE
  runtime_arg: CILIUM_RUNTIME_IMAGE
  envoy_arg: CILIUM_ENVOY_IMAGE
  source_security_overrides:
    golang.org/x/text: v0.39.0
  reuse_policy: rebuild-from-network-cilium-builder
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cni-agent
  - ebpf-datapath
  - network-policy-enforcement
ports:
  - name: health
    container_port: 9879
    protocol: TCP
    expose: internal
    purpose: Cilium agent health endpoint
security:
  run_as_non_root: false
  read_only_root_filesystem: false
  allow_privilege_escalation: true
  privileged: true
  host_network: true
  automount_service_account_token: true
  drop_capabilities: []
  network_policy: system-component
security_exceptions:
  - field: privileged
    reason: CNI 安装、eBPF 程序加载和节点路由必须由上游 Chart 的 Cilium DaemonSet 在 kube-system 执行。
  - field: host_network
    reason: CNI agent 必须管理节点网络命名空间；该例外不得传播到任何业务或沙箱 Pod。
  - field: host_mounts
    reason: Chart 只挂载上游 CNI、BPF、socket 与状态路径，部署渲染必须逐项复核。
student_access:
  enabled: false
resources:
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 2Gi
selftest:
  commands:
    - name: agent-version
      command:
        - /usr/bin/cilium-agent
        - --version
build:
  context: images/network
  dockerfile: cilium/Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
