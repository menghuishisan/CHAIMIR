# 本文件声明 Cilium 运行基座的来源、漏洞修复边界与供应链门禁。
schema_version: 1
category: network
name: cilium-runtime
image: network/cilium-runtime
labels:
  app.kubernetes.io/name: cilium-runtime
  app.kubernetes.io/component: cni-runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium-runtime
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: cluster-network-base
  chaimir.io/scope: system
  chaimir.io/source: platform-built
description: Cilium 构建与 agent 共用的安全运行基座，使用已验证 Go 1.26.6 工具链。
source:
  type: platform-built
upstream:
  components:
    - image: library/ubuntu
      registry: docker.io
      version: "26.04"
      digest: sha256:3131b4cc82a783df6c9df078f86e01819a13594b865c2cad47bd1bca2b7063bb
    - image: base/go-builder
      registry: registry.chaimir.io
      version: go1.26.6
      digest: sha256:2e1cc3ef0c530f5a92ccd0c7e197f7d16e16e6cf879f43a9dd0657f08c0d3343
    - image: cilium/cilium-llvm
      registry: quay.io
      version: 19.1.7-1782898005-bed4da5
      digest: sha256:270bf0e70853c388b72c2247e4ade91d35d74898e2ec12edd5b72ace9ee34333
    - image: cilium/cilium-bpftool
      registry: quay.io
      version: 7.7.0-1782898005-bed4da5
      digest: sha256:dcfaf42007b0ba55cb73010d078e57139450c89fd697b21817c62dbfeb65095c
    - image: cilium/iptables
      registry: quay.io
      version: 1.8.8-1-1782898005-bed4da5
      digest: sha256:09d2fb75a2e6750135f1c550b477f24798cd210fe74f767c5fdfdad1e71241d4
  source_assets:
    - name: gops
      version: v0.3.29
      url: https://github.com/google/gops/archive/refs/tags/v0.3.29.tar.gz
      sha256: c4637684ac8efbcc0bc55faf64e3920a7764a9ae8f4580945084c1a5b8b2d051
    - name: cni-plugins
      version: v1.9.1
      url: https://github.com/containernetworking/plugins/archive/refs/tags/v1.9.1.tar.gz
      sha256: 34bd82d47e981940751619c9cc44c095bb90bfcaf8d71865cbb822c37690a764
    - name: iptables-wrappers
      version: v3
      url: https://github.com/kubernetes-sigs/iptables-wrappers/archive/refs/tags/v3.tar.gz
      sha256: 15dc9570470ee8bdd418259a93d40a10225db30cf094983f5529fe89168ed993
  security_remediation:
    removed_file: /usr/bin/pebble
    reason: Ubuntu 基座遗留 Pebble 不属于 Cilium 运行依赖，构建阶段明确移除该文件。
  reuse_policy: rebuild-fixed-upstream-components
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cni-runtime-base
  - bpf-toolchain-runtime
ports: []
security:
  run_as_non_root: false
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: system-component
security_exceptions:
  - field: run_as_non_root
    reason: 该镜像仅作为构建基座与 CNI agent 文件系统层，最终 agent 的权限由 Chart 单独受控。
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 4Gi
selftest:
  commands:
    - name: runtime-tools
      command:
        - sh
        - -ec
        - test ! -e /usr/bin/pebble && bpftool version && iptables --version
build:
  context: images/network/cilium-runtime
  dockerfile: Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
