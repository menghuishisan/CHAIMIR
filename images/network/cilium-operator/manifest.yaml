# 本文件声明 Cilium generic operator 的来源、权限与供应链门禁。
schema_version: 1
category: network
name: cilium-operator
image: network/cilium-operator
labels:
  app.kubernetes.io/name: cilium-operator
  app.kubernetes.io/component: cni-operator
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium-operator
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: cluster-network-controller
  chaimir.io/scope: system
  chaimir.io/source: platform-built
description: Cilium v1.20.1 generic operator 安全重建镜像。
source:
  type: platform-built
upstream:
  source_repository: https://github.com/cilium/cilium
  version: v1.20.1
  source_commit: 7d68cfb394f2960e10aa72e76d0d51e66c1b2ebc
  builder_arg: CILIUM_BUILDER_IMAGE
  source_security_overrides:
    golang.org/x/text: v0.39.0
  reuse_policy: rebuild-generic-operator-only
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cni-controller
  - cilium-generic-operator
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: true
  drop_capabilities:
    - ALL
  network_policy: system-component
student_access:
  enabled: false
resources:
  cpu_request: 100m
  cpu_limit: "1"
  memory_request: 128Mi
  memory_limit: 512Mi
  ephemeral_storage_limit: 512Mi
selftest:
  commands:
    - name: operator-version
      command:
        - /usr/bin/cilium-operator-generic
        - --version
build:
  context: images/network
  dockerfile: cilium-operator/Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
