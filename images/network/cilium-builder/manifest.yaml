# 本文件声明 Cilium 构建基座的来源、依赖修复与供应链门禁。
schema_version: 1
category: network
name: cilium-builder
image: network/cilium-builder
labels:
  app.kubernetes.io/name: cilium-builder
  app.kubernetes.io/component: cni-build-base
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium-builder
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: build-base
  chaimir.io/scope: build
  chaimir.io/source: build-base
description: Cilium v1.20.1 agent 与 generic operator 的统一 Alpine 安全构建基座。
source:
  type: build-base
upstream:
  components:
    - image: base/go-builder
      registry: registry.chaimir.io
      version: go1.26.6
      digest: sha256:2e1cc3ef0c530f5a92ccd0c7e197f7d16e16e6cf879f43a9dd0657f08c0d3343
    - image: library/alpine
      registry: docker.io
      version: "3.23"
      digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    - image: cilium/cilium-llvm
      registry: quay.io
      version: 19.1.7-1785833026-d8383c5
      digest: sha256:80ae6ceb1a1556d5f65f7a086d873c4706ed548444c4d49d89cbeedf24f817d4
  source_repository: https://github.com/cilium/cilium
  version: v1.20.1
  source_commit: 7d68cfb394f2960e10aa72e76d0d51e66c1b2ebc
  source_archive: https://github.com/cilium/cilium/archive/refs/tags/v1.20.1.tar.gz
  source_sha256: 6b133c7b5a6a037a15c8b5ce02d7fcf94e98d90d121fb76b712c79eda9d36731
  source_assets:
    - name: gops
      version: v0.3.29
      url: https://github.com/google/gops/archive/refs/tags/v0.3.29.tar.gz
      sha256: c4637684ac8efbcc0bc55faf64e3920a7764a9ae8f4580945084c1a5b8b2d051
  builder_arg: GO_BUILDER_IMAGE
  source_security_overrides:
    golang.org/x/text: v0.39.0
  reuse_policy: rebuild-signed-official-release-source
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cilium-source-build
  - bpf-build-toolchain
ports: []
local_dev:
  host_mappings: []
security:
  run_as_non_root: false
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: build-only
security_exceptions:
  - field: run_as_non_root
    reason: 构建阶段需要写入受控 Go、ccache 与源码目录；该镜像不作为 Kubernetes 工作负载运行。
student_access:
  enabled: false
resources:
  cpu_request: "1"
  cpu_limit: "4"
  memory_request: 2Gi
  memory_limit: 6Gi
  ephemeral_storage_limit: 12Gi
selftest:
  commands:
    - name: source-and-vendor
      command:
        - sh
        - -ec
        - test "$(cat /src/cilium/VERSION)" = "1.20.1" && grep -q '^# golang.org/x/text v0.39.0$' /src/cilium/vendor/modules.txt
build:
  context: images/network
  dockerfile: cilium-builder/Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest_in_production: true
