# 本文件声明 Cilium 构建基座的来源、依赖修复与供应链门禁。
schema_version: 1
category: network
name: cilium-builder
image: network/cilium-builder
labels:
  app.kubernetes.io/name: cilium-builder
  app.kubernetes.io/component: cni-build-base
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: network
  chaimir.io/image: network/cilium-builder
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: build-base
  chaimir.io/scope: build
  chaimir.io/source: build-base
description: Cilium v1.20.0 agent 与 generic operator 的统一安全构建基座。
source:
  type: build-base
upstream:
  components:
    - image: library/golang
      registry: docker.io
      version: "1.26.5"
      digest: sha256:3aff6657219a4d9c14e27fb1d8976c49c29fddb70ba835014f477e1c70636647
  source_repository: https://github.com/cilium/cilium
  version: v1.20.0
  source_commit: 450c53145dc0a872ae20dfb05598c94ef55a71e2
  source_archive: https://github.com/cilium/cilium/archive/refs/tags/v1.20.0.tar.gz
  source_sha256: 07d7dff04f749ef26d6244ecd9affd83bde106a1eb8472d0d9aef636df01b91d
  builder_arg: CILIUM_RUNTIME_IMAGE
  source_security_overrides:
    golang.org/x/text: v0.39.0
  reuse_policy: rebuild-signed-official-release-source
  license: Apache-2.0
private_delivery:
  offline_bundle: true
  import_project: network
data_driven: false
capabilities:
  - cilium-source-build
  - bpf-build-toolchain
ports: []
local_dev:
  host_mappings: []
security:
  run_as_non_root: false
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: build-only
security_exceptions:
  - field: run_as_non_root
    reason: 构建阶段需要写入受控 Go、ccache 与源码目录；该镜像不作为 Kubernetes 工作负载运行。
student_access:
  enabled: false
resources:
  cpu_request: "1"
  cpu_limit: "4"
  memory_request: 2Gi
  memory_limit: 6Gi
  ephemeral_storage_limit: 12Gi
selftest:
  commands:
    - name: source-and-vendor
      command:
        - sh
        - -ec
        - test "$(cat /src/cilium/VERSION)" = "1.20.0" && grep -q '^# golang.org/x/text v0.39.0$' /src/cilium/vendor/modules.txt
build:
  context: images/network
  dockerfile: cilium-builder/Dockerfile
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest_in_production: true
