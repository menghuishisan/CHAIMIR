# 本文件声明 judger/testcase-evm 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: judger
name: testcase-evm
image: judger/testcase-evm
labels:
  app.kubernetes.io/name: testcase-evm
  app.kubernetes.io/component: judger
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: judger
  chaimir.io/image: judger/testcase-evm
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: judge-private
  chaimir.io/scope: judge
  chaimir.io/source: platform-built
description: EVM Hardhat/Foundry 测试用例判题镜像。
source:
  type: platform-built
upstream:
  components:
    - image: ghcr.io/foundry-rs/foundry:v1.7.1
      digest: sha256:bdc584033cefab8be282c7f57c263cda42f04700cd1ec88d64bebe2f645aba72
      role: foundry-toolchain
    - image: node:24-trixie-slim
      digest: sha256:db4f733c26868756bae92ac764d7e99bf31809ce7db886ed525960fe7d544601
      role: node-build
    - image: alpine:3.23
      digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
      role: runtime-shell
  reuse_policy: self-developed-judger
data_driven: true
capabilities:
  provides:
    - judger
    - evm-testcase-runner
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
judger:
  type: testcase
  runtime_code: evm-foundry
  genesis_ref: genesis/evm-foundry/platform-selftest.json
  command:
    - run-evm-tests
  exec_target: sandbox/testcase-evm
  env:
    - name: CHAIMIR_SUBMISSION_DIR
      value: /judge-private
  suite_archive_name: platform-selftest.tar
  modes:
    - hardhat
    - foundry
  output_contract:
    required_fields:
      - passed
      - score
      - max_score
      - details
  leaks_expected_values: false
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 4Gi
  timeout_seconds: 120
build:
  context: images/judger/testcase-evm
  dockerfile: Dockerfile
selftest:
  commands:
    - name: tool-versions
      command:
        - sh
        - -lc
        - "hardhat --version && forge --version"
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
