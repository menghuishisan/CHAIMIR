# 本文件声明 judger/testcase-evm 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: judger
name: testcase-evm
image: judger/testcase-evm
labels:
  app.kubernetes.io/name: testcase-evm
  app.kubernetes.io/component: judger
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: judger
  chaimir.io/image: judger/testcase-evm
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: judge-private
  chaimir.io/scope: judge
  chaimir.io/source: platform-built
description: EVM Hardhat/Foundry 测试用例判题镜像。
source:
  type: platform-built
upstream:
  components:
    - image: base/judge-min
      digest: sha256:094f1fffc4a1c42bfa31f8c445ff6cadd320a9f6f611539a91cb2b5d446f1811
      role: result-normalizer
    - image: runtime/evm-hardhat
      digest: sha256:344843a7c5b7bf2b8496decd4ddd143c0c890aa7649468920dca4bec40e39ad1
      role: hardhat-foundry-solidity-toolchain
  reuse_policy: self-developed-judger
data_driven: true
toolchain:
  language: solidity
  selection: project-config
  offline: true
  compiler_versions:
    - version: 0.8.20
      executable: /usr/local/bin/solc-0.8.20
    - version: 0.8.24
      executable: /usr/local/bin/solc-0.8.24
    - version: 0.8.26
      executable: /usr/local/bin/solc-0.8.26
capabilities:
  provides:
    - judger
    - evm-testcase-runner
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
judger:
  type: testcase
  runtime_code: evm-foundry
  genesis_ref: genesis/evm-foundry/platform-selftest.json
  command:
    - run-evm-tests
  exec_target: sandbox/testcase-evm
  env:
    - name: CHAIMIR_SUBMISSION_DIR
      value: /judge-private
    - name: HOME
      value: /judge-private/home
  suite_archive_name: platform-selftest.tar
  modes:
    - hardhat
    - foundry
  output_contract:
    required_fields:
      - passed
      - score
      - max_score
      - details
  leaks_expected_values: false
ports: []
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 4Gi
  timeout_seconds: 120
build:
  context: images/judger/testcase-evm
  dockerfile: Dockerfile
selftest:
  commands:
    - name: tool-versions
      command:
        - sh
        - -lc
        - 'set -eu; hardhat --version; forge --version; for version in 0.8.20 0.8.24 0.8.26; do case "$(/usr/local/bin/solc-${version} --version)" in *"Version: ${version}"*) ;; *) exit 1 ;; esac; done'
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
