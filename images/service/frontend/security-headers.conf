# 本文件是前端静态服务的安全响应头唯一定义处,由 nginx.conf 的每个 location 显式 include。
#
# 为什么必须每个 location 都 include:nginx 的 add_header 不做合并继承 ——
# 只要子 location 自己写了任何一条 add_header,父级的全部 add_header 就都不生效。
# `/assets/` 要发 Cache-Control、`/healthz` 要发 Content-Type,若只在 server 级声明安全头,
# 这两处会静默丢掉全部安全头。故收敛成一份 include,谁都不许各写一遍。
#
# 指令依据实际构建产物核定(见 docs/04-仿真可视化引擎/07-安全设计.md §2 的第三道防线):
#   script-src / worker-src 'self' —— 产物零内联脚本、零 eval;Monaco 与仿真 Worker 都是同源 /assets/*.js
#   style-src 加 'unsafe-inline' —— Radix 弹层用内联 style 定位(Popover/Modal/Menu),是定位机制不是注入面
#   img-src 加 data: —— Monaco 内置若干 data:image/png 图标
#   font-src 加 data: —— 字体分片中有一片以 data:font/woff2 内联
#   media-src / img-src 加 blob: —— 课时视频与导出文件经统一文件服务取回后用 blob 播放/保存
#   connect-src 'self' —— 后端 API 与 WebSocket 同源(后端无 CORS 中间件)
#   frame-src 仅允许同源平台页与独立沙箱工具域名,不接受任意第三方来源
#   object-src / base-uri 'none'、frame-ancestors 'self' —— 关闭插件、base 劫持与被外站嵌套
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' https://tools.chaimir.io; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# 平台不使用摄像头/麦克风/地理位置/USB/支付;显式关掉,避免嵌入内容借页面权限提权。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
