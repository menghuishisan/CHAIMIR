# 本文件声明 observability/grafana 上游固定镜像的来源、配置、端口、数据卷和生产门禁。
schema_version: 1
category: observability
name: grafana
image: observability/grafana
labels:
  app.kubernetes.io/name: grafana
  app.kubernetes.io/component: observability
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: observability
  chaimir.io/image: observability/grafana
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: observability
  chaimir.io/scope: observability
  chaimir.io/source: platform-built
description: Grafana 监控看板官方 distroless 镜像。
source:
  type: platform-built
upstream:
  registry: docker.io
  image: grafana/grafana
  version: "13.2.0"
  digest: sha256:08e6ab6d67a5e21e6540724d3673a572840a43b1ba02d03922d0a21a7dbb38f9
  upstream_tag: 13.2.0-distroless
  source_repository: https://github.com/grafana/grafana
  source_commit: f681b1359f6a0b8ecb9f2c49a88ac72b75bde73b
  source_archive: https://codeload.github.com/grafana/grafana/tar.gz/f681b1359f6a0b8ecb9f2c49a88ac72b75bde73b
  source_sha256: 8ea494789b17d13d7e6032ff158af581d512b9ba3c7e99fae33ba5c19e78a9bd
  plugin_source_repository: https://github.com/grafana/grafana-prometheus-datasource
  plugin_source_tag: v13.1.7
  plugin_source_commit: 2e10053dd7d940f9eb91701df5122c8e348a0d18
  plugin_source_archive: https://codeload.github.com/grafana/grafana-prometheus-datasource/tar.gz/2e10053dd7d940f9eb91701df5122c8e348a0d18
  plugin_source_sha256: 8e66640a7c45b6762d1ac14aa7a94b87fa21c771b4d0d739a3a6716d6a019954
  builder_image: golang:1.26.6-alpine
  builder_digest: sha256:3889b425f035be855a72fb4755265311293b6d414521f0a519d819df32222d83
  sanitize_image: alpine:3.24.1
  sanitize_digest: sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  runtime_image: gcr.io/distroless/static-debian13
  runtime_digest: sha256:f2ea2709ac8db56323cbd7d014277f32cb572d9ea124b0076f7aafe5980678fe
  reuse_policy: source-rebuild
  license: AGPL-3.0
private_delivery:
  offline_bundle: true
  import_project: observability
data_driven: false
capabilities:
  - dashboards
  - monitoring-embed
env_keys:
  config:
    - MONITORING_PANELS_JSON
  secret: []
secrets_required: []
ports:
  - name: http
    container_port: 3000
    protocol: TCP
    expose: gateway
    purpose: Grafana UI through authenticated ingress
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Grafana 需要写插件、会话和 SQLite/缓存数据卷。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
data_volumes:
  - name: data
    mount_path: /var/lib/grafana
    backup_required: true
backup:
  required: true
  mode: dashboard-export-and-volume
network:
  expose: internal
  default_deny: true
resources:
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 256Mi
  memory_limit: 1Gi
  ephemeral_storage_limit: 1Gi
selftest:
  upstream_healthcheck:
    type: http
    path: /api/health
    port: 3000
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
  deployable: true
build:
  context: images/observability/grafana
  dockerfile: Dockerfile
