# 本文件声明 observability/grafana 上游固定镜像的来源、配置、端口、数据卷和生产门禁。
schema_version: 1
category: observability
name: grafana
image: observability/grafana
labels:
  app.kubernetes.io/name: grafana
  app.kubernetes.io/component: observability
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: observability
  chaimir.io/image: observability/grafana
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: observability
  chaimir.io/scope: observability
  chaimir.io/source: platform-built
description: Grafana 监控看板官方 distroless 镜像,Prometheus 数据源由核心服务提供。
source:
  type: platform-built
upstream:
  registry: docker.io
  image: grafana/grafana
  version: "13.1.6"
  digest: sha256:99ec731555ea3be88a491da7cc28a5801b0240309e4e15e1cac4a592b099ec14
  upstream_tag: 13.1.6-distroless
  source_repository: https://github.com/grafana/grafana
  source_commit: 25d4f6c5c796b3a1390163406484ade5bd150851
  source_archive: https://codeload.github.com/grafana/grafana/tar.gz/25d4f6c5c796b3a1390163406484ade5bd150851
  source_sha256: e59bc214c9c424b927c6c5ea97c594802d756d83dad92c5e7feafea4ba043614
  tempo_source_archive: https://codeload.github.com/grafana/tempo/tar.gz/refs/tags/v2.10.3
  tempo_source_sha256: f4f95d0f9cb035789645503185670be311c29fd3ea3d3443c302936f6b8993f7
  builder_image: registry.chaimir.io/base/go-builder
  builder_digest: sha256:46d92c9696e24102dd211235153b05362a58a9f3d2068a5384f8dde7c1bccfac
  sanitize_image: alpine:3.24.1
  sanitize_digest: sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  runtime_image: gcr.io/distroless/base-nossl-debian13
  runtime_digest: sha256:8c563c1fb5e120606f0d85733049775faed6192e2bd2223ef283a5393eec22b9
  build_base_arg: GO_BUILDER_IMAGE
  build_base_image: registry.chaimir.io/base/go-builder
  build_base_digest: sha256:46d92c9696e24102dd211235153b05362a58a9f3d2068a5384f8dde7c1bccfac
  reuse_policy: source-rebuild
  security_rebuild:
    github.com/apache/thrift: v0.24.0
    github.com/grafana/tempo: v2.10.3 (fixed source, module path normalized to /v2 in builder)
    google.golang.org/grpc: v1.83.2
  license: AGPL-3.0
private_delivery:
  offline_bundle: true
  import_project: observability
data_driven: false
capabilities:
  - dashboards
  - monitoring-embed
env_keys:
  config:
    - MONITORING_PANELS_JSON
  secret: []
secrets_required: []
ports:
  - name: http
    container_port: 3000
    protocol: TCP
    expose: gateway
    purpose: Grafana UI through authenticated ingress
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: Grafana 需要写插件、会话和 SQLite/缓存数据卷。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
data_volumes:
  - name: data
    mount_path: /var/lib/grafana
    backup_required: true
backup:
  required: true
  mode: dashboard-export-and-volume
network:
  expose: internal
  default_deny: true
resources:
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 256Mi
  memory_limit: 1Gi
  ephemeral_storage_limit: 1Gi
selftest:
  upstream_healthcheck:
    type: http
    path: /api/health
    port: 3000
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
  deployable: true
build:
  context: images/observability/grafana
  dockerfile: Dockerfile
