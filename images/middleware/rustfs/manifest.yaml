# 本文件声明 middleware/rustfs 的 S3 对象存储能力、固定来源、端口、数据卷和生产门禁。
schema_version: 1
category: middleware
name: rustfs
image: middleware/rustfs
labels:
  app.kubernetes.io/name: rustfs
  app.kubernetes.io/component: middleware
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: middleware
  chaimir.io/image: middleware/rustfs
  chaimir.io/data-driven: "false"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: stateful-middleware
  chaimir.io/scope: middleware
  chaimir.io/source: thin-wrapper
description: RustFS S3 兼容对象存储和备份对象仓库。
source:
  type: thin-wrapper
upstream:
  image: rustfs/rustfs
  registry: docker.io
  version: 1.0.0-rc.3
  digest: sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
  source_repository: https://github.com/rustfs/rustfs
  commit: 1aae6803739a5bac67e0d702ac46d43f09fb06dd
  license: Apache-2.0
  reuse_policy: fixed-upstream-wrapper
private_delivery:
  offline_bundle: true
  import_project: middleware
build:
  context: images/middleware/rustfs
  dockerfile: Dockerfile
data_driven: false
capabilities:
  - s3-object-storage
  - artifact-store
  - backup-store
env_keys:
  config:
    - RUSTFS_ADDRESS
    - RUSTFS_VOLUMES
    - RUSTFS_REGION
  secret:
    - RUSTFS_ACCESS_KEY
    - RUSTFS_SECRET_KEY
secrets_required:
  - env: RUSTFS_ACCESS_KEY
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
  - env: RUSTFS_SECRET_KEY
    source: deploy/config/chaimir.env
    runtime_value: secret-or-kms
ports:
  - name: api
    container_port: 9000
    protocol: TCP
    expose: internal
    purpose: S3 API
  - name: console
    container_port: 9001
    protocol: TCP
    expose: internal
    purpose: RustFS console, only for operators through authenticated access
security:
  run_as_non_root: true
  read_only_root_filesystem: false
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: read_only_root_filesystem
    reason: RustFS 需要写对象数据、元数据和运行日志;只允许写入声明的数据卷。
    writable_mounts:
      - data
data_volumes:
  - name: data
    mount_path: /data
    backup_required: true
backup:
  required: true
  mode: object-copy-and-volume
network:
  expose: internal
  default_deny: true
resources:
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 128Mi
  memory_limit: 512Mi
  ephemeral_storage_limit: 1Gi
selftest:
  commands:
    - name: rustfs-version
      command:
        - rustfs
        - --version
  upstream_healthcheck:
    type: http
    path: /health/ready
    port: 9000
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
