# 本文件声明 runtime/edu-chain 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: edu-chain
image: runtime/edu-chain
labels:
  app.kubernetes.io/name: edu-chain
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/edu-chain
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: 平台自研教学链运行时镜像。
source:
  type: platform-built
upstream:
  builder: base/go-builder
  reuse_policy: self-developed-static-runtime
env_keys:
  config:
    - CHAIMIR_EDU_CHAIN_PORT
    - CHAIMIR_EDU_CHAIN_ID
    - CHAIMIR_MAX_BODY_BYTES
    - CHAIMIR_CHAIN_RPC_URL
  secret: []
data_driven: true
capabilities:
  provides:
    - chain-runtime
    - teaching-consensus
    - protocol-visualization
    - static-runtime
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: edu
  adapter_level: 2
  native:
    helper: /usr/local/bin/chaimir-edu-chain
    profile: edu-chain-http
    exec_target: sandbox/runtime
    reset_strategy: recreate_runtime
    actions:
      deploy: [/usr/local/bin/chaimir-edu-chain, -adapter, deploy]
      tx: [/usr/local/bin/chaimir-edu-chain, -adapter, tx]
      query: [/usr/local/bin/chaimir-edu-chain, -adapter, query]
ports:
  - name: http
    container_port: 8080
    protocol: TCP
    expose: proxy
    purpose: Edu chain teaching API
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 128Mi
  memory_limit: 512Mi
  ephemeral_storage_limit: 1Gi
build:
  context: images/runtime/edu-chain
  dockerfile: Dockerfile
selftest:
  commands:
    - name: syntax
      command:
        - /usr/local/bin/chaimir-edu-chain
        - -selftest
capability_selftest:
  deploy_payload:
    data: chaimir-capability-selftest
  query_target: chain
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
