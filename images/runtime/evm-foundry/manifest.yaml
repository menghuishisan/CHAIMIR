# 本文件声明 runtime/evm-foundry 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: evm-foundry
image: runtime/evm-foundry
labels:
  app.kubernetes.io/name: evm-foundry
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/evm-foundry
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Foundry/Anvil EVM 运行时镜像。
source:
  type: thin-wrapper
upstream:
  image: ghcr.io/foundry-rs/foundry:v1.7.1
  version: v1.7.1
  digest: sha256:bdc584033cefab8be282c7f57c263cda42f04700cd1ec88d64bebe2f645aba72
  reuse_policy: thin-wrapper
env_keys:
  config:
    - CHAIMIR_EVM_RPC_URL
    - CHAIMIR_RUNTIME_RPC_PORT
    - CHAIMIR_CHAIN_STATE_DIR
  secret:
    - CHAIMIR_EVM_DEPLOYER_PRIVATE_KEY
secrets_required:
  - env: CHAIMIR_EVM_DEPLOYER_PRIVATE_KEY
    source: deploy/config/chaimir.env
    runtime_value: secret-or-payload
data_driven: true
capabilities:
  provides:
    - chain-runtime
    - evm-json-rpc
    - foundry-toolchain
    - fork-capable
    - chain-capability-helper
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: evm
  adapter_level: 2
  native:
    helper: /usr/local/bin/chaimir-foundry-adapter
    profile: evm-contract
    exec_target: sandbox/runtime
    reset_strategy: recreate_runtime
    actions:
      deploy: [/usr/local/bin/chaimir-foundry-adapter, deploy]
      tx: [/usr/local/bin/chaimir-foundry-adapter, tx]
      query: [/usr/local/bin/chaimir-foundry-adapter, query]
ports:
  - name: rpc
    container_port: 8545
    protocol: TCP
    expose: proxy
    purpose: EVM JSON-RPC
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/runtime/evm-foundry
  dockerfile: Dockerfile
selftest:
  commands:
    - name: foundry-tools
      command:
        - sh
        - -lc
        - "forge --version && anvil --version && cast --version"
capability_selftest:
  deploy_payload:
    bytecode: "0x6005600c60003960056000f3600060005500"
    from: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  query_target: chainId
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
