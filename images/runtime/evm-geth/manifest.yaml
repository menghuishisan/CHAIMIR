# 本文件声明 runtime/evm-geth 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: evm-geth
image: runtime/evm-geth
labels:
  app.kubernetes.io/name: evm-geth
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/evm-geth
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: go-ethereum 私链运行时官方源码重建镜像。
source:
  type: platform-built
upstream:
  source_repository: https://github.com/ethereum/go-ethereum
  version: v1.17.4
  source_sha256: 80b4dee3b89ea40bedc808132befd605208089fdb8fde7981fc3c530596d3a9e
  builder_arg: GO_BUILDER_IMAGE
  runtime: alpine:3.23
  runtime_digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
  reuse_policy: source-build
data_driven: true
env_keys:
  config:
    - CHAIMIR_EVM_RPC_URL
    - CHAIMIR_RUNTIME_RPC_PORT
    - CHAIMIR_CHAIN_STATE_DIR
  secret: []
capabilities:
  provides:
    - chain-runtime
    - evm-json-rpc
    - geth-private-chain
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: evm
  adapter_level: 2
  native:
    helper: /usr/local/bin/chaimir-geth-adapter
    profile: evm-json-rpc
    exec_target: sandbox/runtime
    reset_strategy: recreate_runtime
    actions:
      deploy: [/usr/local/bin/chaimir-geth-adapter, deploy]
      tx: [/usr/local/bin/chaimir-geth-adapter, tx]
      query: [/usr/local/bin/chaimir-geth-adapter, query]
ports:
  - name: rpc
    container_port: 8545
    protocol: TCP
    expose: proxy
    purpose: EVM JSON-RPC
rpc_exposure:
  bind_all_interfaces: true
  reason: 容器内 RPC 监听 0.0.0.0,仅允许 M2 生成的 Service/Gateway 暴露。
  allowed_apis:
    - eth
    - net
    - web3
    - debug
    - txpool
  required_controls:
    - network_policy_deny_all
    - platform_authenticated_proxy
    - no_direct_student_shell_to_rpc_admin
    - m2_port_allowlist
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/runtime/evm-geth
  dockerfile: Dockerfile
selftest:
  commands:
    - name: geth-version
      command:
        - geth
        - version
capability_selftest:
  deploy_payload:
    bytecode: "0x6005600c60003960056000f3600060005500"
  query_target: chainId
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
