# 本文件声明 runtime/cosmos 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: cosmos
image: runtime/cosmos
labels:
  app.kubernetes.io/name: cosmos
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/cosmos
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: platform-built
description: Cosmos SDK/Tendermint 单链教学运行时镜像。
source:
  type: platform-built
upstream:
  source_repository: https://github.com/cosmos/gaia
  version: v27.5.0
  source_commit: d089f568a9ef2f4d5e6d5660cb128782f4d1b2c0
  source_sha256: 9d53edfac968af4a2444b0f0748bd95adb071e920ee320dae3c1078555a3a0fa
  builder: golang:1.26.6-bookworm@sha256:433f9dc4f8ea3a1ce4e28f9f15d0f7c056b10475307f886d6f1ac1ccc4abd976
  runtime_image: debian:13-slim
  runtime_digest: sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
  source_downloader: alpine:3.23
  source_downloader_digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
  reuse_policy: source-build
data_driven: true
capabilities:
  provides:
    - chain-runtime
    - cosmos-sdk-chain
    - tendermint-dev
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: cosmos
  adapter_level: 1
env_keys:
  config:
    - CHAIMIR_COSMOS_HOME
    - CHAIMIR_COSMOS_MIN_GAS_PRICES
    - CHAIMIR_COSMOS_RPC_LADDR
    - CHAIMIR_COSMOS_REST_ADDRESS
    - CHAIMIR_COSMOS_GRPC_ADDRESS
ports:
  - name: rpc
    container_port: 26657
    protocol: TCP
    expose: proxy
    purpose: Tendermint RPC
  - name: rest
    container_port: 1317
    protocol: TCP
    expose: proxy
    purpose: Cosmos REST API
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 8Gi
build:
  context: images/runtime/cosmos
  dockerfile: Dockerfile
selftest:
  commands:
    - name: gaia-version
      command:
        - /usr/local/bin/gaiad
        - version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
