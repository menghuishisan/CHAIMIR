# 本文件声明 runtime/evm-hardhat 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: evm-hardhat
image: runtime/evm-hardhat
labels:
  app.kubernetes.io/name: evm-hardhat
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/evm-hardhat
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Hardhat EVM 教学运行时镜像。
source:
  type: thin-wrapper
upstream:
  image: node:22-bookworm-slim
  version: 22-bookworm-slim
  digest: sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
  runtime_image: cgr.dev/chainguard/glibc-dynamic
  runtime_digest: sha256:d0046044cd28948d3380eb0d98709dc7e63f98161fe7105135e1025650bad17a
  components:
    - image: ghcr.io/foundry-rs/foundry:v1.7.1
      digest: sha256:bdc584033cefab8be282c7f57c263cda42f04700cd1ec88d64bebe2f645aba72
      role: foundry-toolchain
    - image: node:22-bookworm-slim
      role: node-runtime
      digest: sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
  reuse_policy: toolchain-wrapper
data_driven: true
env_keys:
  config:
    - CHAIMIR_EVM_RPC_URL
    - CHAIMIR_RUNTIME_RPC_PORT
    - CHAIMIR_CHAIN_STATE_DIR
  secret: []
capabilities:
  provides:
    - chain-runtime
    - evm-json-rpc
    - solidity-dev
    - fork-capable
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: evm
  adapter_level: 2
  native:
    helper: /usr/local/bin/chaimir-hardhat-adapter
    profile: evm-json-rpc
    exec_target: sandbox/runtime
    reset_strategy: recreate_runtime
    actions:
      deploy: [/usr/local/bin/chaimir-hardhat-adapter, deploy]
      tx: [/usr/local/bin/chaimir-hardhat-adapter, tx]
      query: [/usr/local/bin/chaimir-hardhat-adapter, query]
ports:
  - name: rpc
    container_port: 8545
    protocol: TCP
    expose: proxy
    purpose: EVM JSON-RPC
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 250m
  cpu_limit: "2"
  memory_request: 512Mi
  memory_limit: 2Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/runtime/evm-hardhat
  dockerfile: Dockerfile
selftest:
  commands:
    - name: hardhat-and-anvil
      command:
        - sh
        - -lc
        - "hardhat --version && anvil --version"
capability_selftest:
  deploy_payload:
    bytecode: "0x6005600c60003960056000f3600060005500"
    from: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  query_target: chainId
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
