# 本文件声明 runtime/solana 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: solana
image: runtime/solana
labels:
  app.kubernetes.io/name: solana
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/solana
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: Solana test-validator 教学运行时镜像。
source:
  type: thin-wrapper
upstream:
  image: solanalabs/solana:v1.18.26
  version: v1.18.26
  digest: sha256:098806e64d44bccdbedbf07c2edabd1c850b92c8a4a0f81eba9c789034813db6
  runtime_image: cgr.dev/chainguard/glibc-dynamic
  runtime_digest: sha256:d0046044cd28948d3380eb0d98709dc7e63f98161fe7105135e1025650bad17a
  builder_image: golang:1.26.6-bookworm
  builder_digest: sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36
  runtime_libs_image: debian:13-slim
  runtime_libs_digest: sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
  runtime_tools_image: cgr.dev/chainguard/wolfi-base
  runtime_tools_digest: sha256:6677ae802613d558c16d8bbb2ef2ec89e2e33089bbf78c8f3090ac159bf02d4c
  reuse_policy: thin-wrapper
data_driven: true
env_keys:
  config:
    - CHAIMIR_SOLANA_LEDGER_DIR
    - CHAIMIR_RUNTIME_RPC_PORT
  secret: []
capabilities:
  provides:
    - chain-runtime
    - solana-validator
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: solana
  adapter_level: 1
ports:
  - name: rpc
    container_port: 8899
    protocol: TCP
    expose: proxy
    purpose: Solana JSON-RPC
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 4Gi
  ephemeral_storage_limit: 8Gi
build:
  context: images/runtime/solana
  dockerfile: Dockerfile
selftest:
  commands:
    - name: solana-version
      command:
        - solana
        - --version
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
