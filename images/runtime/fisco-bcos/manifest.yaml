# 本文件声明 runtime/fisco-bcos 镜像的职责、端口、安全、资源和供应链约束。
schema_version: 1
category: runtime
name: fisco-bcos
image: runtime/fisco-bcos
labels:
  app.kubernetes.io/name: fisco-bcos
  app.kubernetes.io/component: runtime
  app.kubernetes.io/part-of: chaimir
  chaimir.io/category: runtime
  chaimir.io/image: runtime/fisco-bcos
  chaimir.io/data-driven: "true"
  chaimir.io/student-access: "false"
  chaimir.io/sensitivity: student-runtime
  chaimir.io/scope: sandbox
  chaimir.io/source: thin-wrapper
description: FISCO BCOS 联盟链教学运行时镜像。
source:
  type: platform-built
upstream:
  image: fiscoorg/fiscobcos:v3.12.1
  version: v3.12.1
  digest: sha256:93db5277a5c896fde402f2165d133cc3d346effef4165ec417ef098eb2ede74b
  runtime: alpine:3.23
  runtime_digest: sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
  reuse_policy: official-static-binary-on-supported-base
  config_assets:
    - url: https://github.com/FISCO-BCOS/FISCO-BCOS/releases/download/v3.11.0/build_chain.sh
      sha256: 288efe6154b3bf40e6849448b496bee92517c917f3dd8a82a47dfcbabbd30364
    - url: https://github.com/FISCO-BCOS/TASSL/releases/download/V_1.4/tassl-1.1.1b-linux-x86_64.tar.gz
      sha256: 97700126df491b4ae15afae1bad99979390ded5d7d1655632e00b40003a9a9e8
data_driven: true
env_keys:
  config:
    - CHAIMIR_FISCO_CONFIG
  secret: []
capabilities:
  provides:
    - chain-runtime
    - fisco-node
  requires: []
  conflicts: []
  cardinality: one
  placement: sandbox
  config_schema: {}
  student_access: private
runtime:
  eco: fisco
  adapter_level: 1
  runtime_config_required: true
  workload:
    env:
      - name: CHAIMIR_FISCO_CONFIG
        value: /runtime-state/fisco/nodes/127.0.0.1/node0/config.ini
    init_containers:
      - name: fisco-config
        image_url: "@self"
        command:
          - /usr/local/bin/chaimir-fisco-config-init
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        read_only_root_filesystem: true
        mount_workspace: false
        prepull_command:
          - /usr/local/bin/chaimir-fisco-config-init
ports:
  - name: p2p
    container_port: 30300
    protocol: TCP
    expose: internal
    purpose: FISCO BCOS P2P
  - name: rpc
    container_port: 20200
    protocol: TCP
    expose: proxy
    purpose: FISCO BCOS RPC
security:
  run_as_non_root: true
  read_only_root_filesystem: true
  allow_privilege_escalation: false
  privileged: false
  host_network: false
  automount_service_account_token: false
  drop_capabilities:
    - ALL
  network_policy: deny-all
security_exceptions:
  - field: writable_mounts
    reason: FISCO BCOS 节点需要写账本、日志和运行态;配置文件由 M2 注入,状态只允许写入 runtime-state。
    writable_mounts:
      - runtime-state
student_access:
  enabled: false
  shell: none
  allowed_mounts: []
resources:
  cpu_request: 500m
  cpu_limit: "2"
  memory_request: 1Gi
  memory_limit: 3Gi
  ephemeral_storage_limit: 4Gi
build:
  context: images/runtime/fisco-bcos
  dockerfile: Dockerfile
selftest:
  commands:
    - name: fisco-version
      command:
        - sh
        - -lc
        - "CHAIMIR_SELFTEST=1 /usr/local/bin/chaimir-fisco-entrypoint"
supply_chain:
  sbom: true
  trivy_required: true
  cosign_required: true
  pull_by_digest: true
