# 本文件按模块维护 sandbox 路径项。
/api/v1/sandbox/catalog:
  get:
    tags: [sandbox]
    summary: 编排目录(可用运行时与工具的最小字段)
    operationId: sandboxOrchestrationCatalog
    x-chaimir-audience: platform-admin-or-teacher
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/catalog/composition-preview:
  post:
    tags: [sandbox]
    summary: 只读解析组合依赖与连接候选
    description: bindings 返回用户向 title。optional 为 true 的连接可不选、不自动授权唯一候选，不拉入依赖；未连接不注入地址或网络权限。multiple 表示允许同一绑定选择多个目标；必需绑定至少选一个，每个目标提交完整 link，多目标地址由编译器编码为排序后的 JSON 字符串数组。
    operationId: sandboxPreviewComposition
    x-chaimir-audience: platform-admin-or-teacher
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes:
  get:
    tags: [sandbox]
    summary: 运行时列表
    description: 每条带 available_image_count（可用镜像版本数，一次分组计数取出），供列表卡片算接入进度；单条读取不带该字段。
    operationId: sandboxListRuntimes
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [sandbox]
    summary: 注册运行时
    operationId: sandboxRegisterRuntime
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes/{id}:
  get:
    tags: [sandbox]
    summary: 运行时详情
    operationId: sandboxGetRuntime
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  patch:
    tags: [sandbox]
    summary: 更新运行时配置
    operationId: sandboxUpdateRuntime
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes/{id}/selftest:
  post:
    tags: [sandbox]
    summary: 触发运行时接入自检
    operationId: sandboxRunRuntimeSelftest
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  get:
    tags: [sandbox]
    summary: 查询运行时自检结果
    operationId: sandboxGetRuntimeSelftest
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes/{id}/images:
  get:
    tags: [sandbox]
    summary: 运行时镜像版本列表
    operationId: sandboxListRuntimeImages
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [sandbox]
    summary: 登记运行时镜像版本
    operationId: sandboxRegisterRuntimeImage
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes/{id}/images/{img}:
  delete:
    tags: [sandbox]
    summary: 停用运行时镜像版本
    operationId: sandboxDisableRuntimeImage
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ImagePath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/runtimes/{id}/images/{img}/prepull:
  post:
    tags: [sandbox]
    summary: 按冻结组合摘要预拉取完整镜像闭包
    operationId: sandboxPrepullRuntimeImage
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ImagePath" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [composition_digest]
            properties:
              composition_digest:
                type: string
                minLength: 1
                description: M2 已登记的冻结组合摘要，完整快照及镜像闭包由服务端读取。
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  get:
    tags: [sandbox]
    summary: 查询指定冻结组合的镜像预拉取状态
    description: 进行中返回编排器最近一次真实节点进度；image_count 按完整镜像地址去重，与触发和加入等待的响应一致。
    operationId: sandboxGetRuntimeImagePrepull
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "#/components/parameters/IDPath" }
      - { $ref: "#/components/parameters/ImagePath" }
      - name: composition_digest
        in: query
        required: true
        schema: { type: string, minLength: 1 }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/tools:
  get:
    tags: [sandbox]
    summary: 工具列表
    operationId: sandboxListTools
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [sandbox]
    summary: 注册工具定义
    operationId: sandboxRegisterTool
    description: 命令工具和网页工具必须在 resource_spec.components 的每个组件中声明镜像自检命令 prepull_command。
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes:
  post:
    tags: [sandbox]
    summary: 创建沙箱
    description: 请求包含完整 composition_snapshot、owner_account_id、可选 authorized_account_ids、scope_ref 及保活/快照参数；租户和来源只取服务签名上下文，请求体不接受 tenant_id、source_ref 或独立 composition_digest。新创建在事务提交后返回分配中、创建中的受理快照，包含沙箱编号及冻结能力；启动异步推进，通过现有详情和进度观察就绪。重复请求返回已有沙箱的当前状态。
    operationId: sandboxCreateSandbox
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [composition_snapshot, owner_account_id, scope_ref]
            properties:
              composition_snapshot:
                type: object
                additionalProperties: true
                description: M2 已编译登记的完整冻结快照，内容须与其中 digest 及服务端记录一致。
              owner_account_id: { $ref: "#/components/schemas/SnowflakeID" }
              authorized_account_ids:
                type: array
                items: { $ref: "#/components/schemas/SnowflakeID" }
              scope_ref: { type: string, minLength: 1 }
              keep_alive: { type: boolean, default: false }
              snapshot_enabled: { type: boolean, default: false }
              keep_alive_minutes: { type: integer, format: int32, minimum: 0, default: 0 }
              snapshot_retention_minutes: { type: integer, format: int32, minimum: 0, default: 0 }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes/recycle:
  post:
    tags: [sandbox]
    summary: 按 scope_ref 批量回收沙箱
    description: 请求体只接受 scope_ref 和可选 reason，租户与来源取服务签名上下文。
    operationId: sandboxRecycleByScopeRef
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [scope_ref]
            properties:
              scope_ref: { type: string, minLength: 1 }
              reason: { type: string }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}:
  get:
    tags: [sandbox]
    summary: 查询沙箱状态、资源用量和工具入口
    operationId: sandboxGetSandbox
    description: resource_usage 为完整用量摘要或 null；采样失败与未采样明确为未知。capabilities 的文件与终端能力只属于工作区实例，chain_operations 是运行时实例到非空操作数组的映射，无链能力返回空对象。
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes/{id}:
  delete:
    tags: [sandbox]
    summary: 主动销毁沙箱
    operationId: sandboxDestroySandbox
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes/{id}/pause:
  post:
    tags: [sandbox]
    summary: 暂停沙箱
    operationId: sandboxPauseSandbox
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes/{id}/resume:
  post:
    tags: [sandbox]
    summary: 恢复沙箱
    operationId: sandboxResumeSandbox
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/progress:
  get:
    tags: [sandbox]
    summary: 沙箱启动进度 WebSocket
    operationId: sandboxProgress
    x-chaimir-audience: user
    x-chaimir-websocket: true
    security: [{ wsTicketAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { name: ticket, in: query, required: true, schema: { type: string }, description: 通过 /api/v1/auth/ws-ticket 换取的短时路径绑定连接票据 }]
    responses: { "101": { description: WebSocket 升级成功 }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/terminal:
  get:
    tags: [sandbox]
    summary: 沙箱终端 WebSocket
    operationId: sandboxTerminal
    x-chaimir-audience: user
    x-chaimir-websocket: true
    security: [{ wsTicketAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { name: container, in: query, schema: { type: string } }, { name: ticket, in: query, required: true, schema: { type: string }, description: 通过 /api/v1/auth/ws-ticket 换取的短时路径绑定连接票据 }]
    responses: { "101": { description: WebSocket 升级成功 }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/files:
  get:
    tags: [sandbox]
    summary: 列目录或读取文件
    operationId: sandboxGetFiles
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/FilePathQuery" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  put:
    tags: [sandbox]
    summary: 写入工作区文件
    operationId: sandboxWriteFile
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/FilePathQuery" }]
    requestBody: { $ref: "#/components/requestBodies/SandboxWorkspaceFileWriteBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/files/save:
  post:
    tags: [sandbox]
    summary: 立即持久化工作区代码
    operationId: sandboxSaveFiles
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/chain/deploy:
  post:
    tags: [sandbox]
    summary: 链上部署
    operationId: sandboxChainDeploy
    x-chaimir-audience: user-or-internal
    security: [{ bearerAuth: [] }, { serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/chain/tx:
  post:
    tags: [sandbox]
    summary: 链上交易
    operationId: sandboxChainSendTx
    x-chaimir-audience: user-or-internal
    security: [{ bearerAuth: [] }, { serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/chain/query:
  get:
    tags: [sandbox]
    summary: 链上查询
    operationId: sandboxChainQuery
    x-chaimir-audience: user-or-internal
    security: [{ bearerAuth: [] }, { serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { name: target, in: query, schema: { type: string } }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/internal/sandboxes/{id}/chain/reset:
  post:
    tags: [sandbox]
    summary: 链恢复创世就绪态
    operationId: sandboxChainReset
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/sandboxes/{id}/command-tools/{tool_code}/run:
  post:
    tags: [sandbox]
    summary: 执行受控命令工具
    operationId: sandboxRunCommandTool
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses:
      "200":
        description: 命令工具执行结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StandardResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      required: [stdout_base64, stderr_base64, exit_code]
                      properties:
                        stdout_base64: { type: string }
                        stderr_base64: { type: string }
                        exit_code: { type: integer }
      default: { $ref: "#/components/responses/Error" }
/api/v1/sandbox/sandboxes/{id}/tools/{tool_code}/{proxy_path}:
  get:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理
    operationId: sandboxToolProxy
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserTicketAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理提交
    operationId: sandboxToolProxyPost
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  put:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理更新
    operationId: sandboxToolProxyPut
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  patch:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理局部更新
    operationId: sandboxToolProxyPatch
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  delete:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理删除
    operationId: sandboxToolProxyDelete
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  head:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理元信息
    operationId: sandboxToolProxyHead
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
  options:
    tags: [sandbox]
    summary: 沙箱 Web 工具代理预检
    operationId: sandboxToolProxyOptions
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }, { browserAccessCookie: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/ToolCodePath" }, { $ref: "#/components/parameters/ProxyPath" }]
    responses: { "200": { description: 工具代理响应 }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sandbox/quota:
  get:
    tags: [sandbox]
    summary: 查看配额与当前用量(校管读本租户,平台按 tenant_id 读目标租户)
    operationId: sandboxQuotaStats
    x-chaimir-audience: platform-admin-or-school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ name: tenant_id, in: query, schema: { $ref: "#/components/schemas/SnowflakeID" } }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  patch:
    tags: [sandbox]
    summary: 调整配额
    operationId: sandboxUpsertQuota
    description: 平台管理员必须指定 tenant_id；校管按统一 JSON 规则解析后覆写为会话租户。七项配额与审计同事务提交。
    x-chaimir-audience: platform-admin-or-school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
