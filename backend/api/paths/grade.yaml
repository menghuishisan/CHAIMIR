# 本文件按模块维护 grade 路径项。
/api/v1/grade-center/level-configs:
  get:
    tags: [grade]
    summary: 等级映射配置列表
    operationId: gradeListLevelConfigs
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [grade]
    summary: 创建等级映射配置
    operationId: gradeCreateLevelConfig
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/level-configs/{id}:
  put:
    tags: [grade]
    summary: 更新等级映射配置
    operationId: gradeUpdateLevelConfig
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/semesters:
  get:
    tags: [grade]
    summary: 学期列表
    operationId: gradeListSemesters
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [grade]
    summary: 创建学期
    operationId: gradeCreateSemester
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/reviews:
  get:
    tags: [grade]
    summary: 成绩审核列表
    description: facets.status：审核状态分段计数，套用锁定与学期筛选、不套用状态筛选。semester_id 按学期筛选，省略为全部学期。每条带 submitter_name 与 course_name（当前页经身份与教学契约批量解析）。
    operationId: gradeListReviews
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "#/components/parameters/StatusQuery" }
      - { name: is_locked, in: query, schema: { type: integer, minimum: 0, maximum: 2 } }
      - { name: semester_id, in: query, schema: { $ref: "#/components/schemas/SnowflakeID" } }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [grade]
    summary: 提交课程成绩审核
    description: 同时要求学校开放教学与成绩模块。可省略semester_id；服务端按课程学期名称精确解析本租户学期并保存实际编号。未登记、显式选择不匹配或课程无实际成绩时返回B0002，不创建待审记录；合法零分允许报送。成绩读取失败明确拒绝。
    operationId: gradeSubmitReview
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/reviews/mine:
  get:
    tags: [grade]
    summary: 我提交的成绩审核列表
    description: 每条带 course_name（当前页经教学契约批量解析）。
    operationId: gradeListOwnReviews
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "#/components/parameters/StatusQuery" }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/reviews/{id}/approve:
  post:
    tags: [grade]
    summary: 通过成绩审核
    description: 显式semester_id优先于报送学期，按课程学期精确校验。审核、受影响学生的GPA/预警、锁outbox及审计同事务提交；任一步失败全部回滚。
    operationId: gradeApproveReview
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/reviews/{id}/reject:
  post:
    tags: [grade]
    summary: 驳回成绩审核
    operationId: gradeRejectReview
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/reviews/{id}/unlock:
  post:
    tags: [grade]
    summary: 解锁成绩审核状态
    operationId: gradeUnlockReview
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/students/{id}/grades:
  get:
    tags: [grade]
    summary: 学生学期成绩与分页课程明细
    description: 仅学生本人和本校校管可读。先筛选M11已审核且锁定课程再分页；学期GPA按所选范围，累计GPA按当前全部已发布课程加权。教师通过M6任教课程查看成绩。
    operationId: gradeStudentGrades
    x-chaimir-audience: school-admin-or-student
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { name: semester, in: query, schema: { type: string } }, { $ref: "#/components/parameters/PageQuery" }, { $ref: "#/components/parameters/SizeQuery" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/students/{id}/gpa:
  get:
    tags: [grade]
    summary: 学生 GPA
    description: 仅学生本人和本校校管可读；各学期摘要只含已发布课程，累计值为当前全部已发布课程的学分加权GPA。
    operationId: gradeStudentGPA
    x-chaimir-audience: school-admin-or-student
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/students/{id}/recompute:
  post:
    tags: [grade]
    summary: 重算学生 GPA
    description: 指定semester_id；在同一事务内重算全部已发布学期和累计值、更新目标学期预警并取得响应摘要。读取或写入失败均回滚。
    operationId: gradeRecomputeStudentGrade
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/appeals:
  get:
    tags: [grade]
    summary: 成绩申诉列表
    description: 按身份分视角：学生只查看本人申诉，教师仅查看本人任教且未删除课程的申诉，学校管理员查看本租户申诉；服务端先限制范围，再按状态分页和统计总数。facets.status：申诉状态分段计数，范围同列表视角，不套用状态筛选。每条带 student_name、student_no 与 course_name（当前页批量解析）。
    operationId: gradeListAppeals
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: "#/components/parameters/StatusQuery" }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [grade]
    summary: 提交成绩申诉
    operationId: gradeCreateAppeal
    x-chaimir-audience: student
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/appeals/{id}/accept:
  post:
    tags: [grade]
    summary: 受理成绩申诉
    operationId: gradeAcceptAppeal
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/appeals/{id}/reject:
  post:
    tags: [grade]
    summary: 驳回成绩申诉
    operationId: gradeRejectAppeal
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/warning-rules:
  get:
    tags: [grade]
    summary: 学业预警规则
    operationId: gradeGetWarningRules
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  put:
    tags: [grade]
    summary: 更新学业预警规则
    operationId: gradeUpdateWarningRules
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/warnings:
  get:
    tags: [grade]
    summary: 学业预警列表
    description: facets.status：预警状态分段计数，套用学生与学期筛选、不套用状态筛选。semester_id 按学期筛选，省略为全部学期。每条带 student_name 与 student_no（当前页经身份契约批量解析）。
    operationId: gradeListWarnings
    x-chaimir-audience: school-admin-or-student
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: student_id, in: query, schema: { $ref: "#/components/schemas/SnowflakeID" } }
      - { $ref: "#/components/parameters/StatusQuery" }
      - { name: semester_id, in: query, schema: { $ref: "#/components/schemas/SnowflakeID" } }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/warnings/{id}/ack:
  post:
    tags: [grade]
    summary: 学生确认学业预警
    operationId: gradeAckWarning
    x-chaimir-audience: student
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/warnings/scan:
  post:
    tags: [grade]
    summary: 扫描生成学业预警
    description: 省略semester_id时只扫描当前学期；重复命中更新原记录事实，保留已知悉和投递状态，created仅计新建数。
    operationId: gradeScanWarnings
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/transcripts:
  post:
    tags: [grade]
    summary: 生成成绩单 PDF
    operationId: gradeGenerateTranscript
    x-chaimir-audience: school-admin-or-student
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/transcripts/{id}:
  get:
    tags: [grade]
    summary: 获取成绩单短时下载授权 JSON
    operationId: gradeDownloadTranscript
    x-chaimir-audience: school-admin-or-student
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/grade-center/transcripts/batch:
  post:
    tags: [grade]
    summary: 批量生成成绩单 PDF
    operationId: gradeGenerateTranscriptBatch
    x-chaimir-audience: school-admin
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
