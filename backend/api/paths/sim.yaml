# 本文件按模块维护 sim 路径项。
/api/v1/sim/shared/{code}:
  get:
    tags: [sim]
    summary: 读取公开分享剧本
    operationId: simGetShared
    x-chaimir-audience: public
    parameters: [{ $ref: "#/components/parameters/CodePath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages:
  get:
    tags: [sim]
    summary: 仿真包列表
    description: 默认只返回已上架包;mine=true 返回当前账号作为作者提交的包，此时 status 可取任一状态，作者边界由服务端会话强制；mine=true 时已退回的包带 reject_comment（最近一次退回的审核意见）。facets.category 与 facets.status：分类与状态分段计数，按场景去重；每组套用关键词、作者范围与另一组的筛选，不套用本组筛选。
    operationId: simListPackages
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: category, in: query, schema: { type: string } }
      - { $ref: "#/components/parameters/KeywordQuery" }
      - { $ref: "#/components/parameters/StatusQuery" }
      - { name: mine, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [sim]
    summary: 提交仿真包
    operationId: simSubmitPackage
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - version
              - name
              - category
              - scale_limit
              - bundle
            properties:
              code:
                type: string
              version:
                type: string
              name:
                type: string
              category:
                type: string
              scale_limit:
                type: string
                description: JSON 编码的规模上限对象，包含 nodes、max_tick、max_events。
              bundle:
                type: string
                format: binary
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages/{key}:
  patch:
    tags: [sim]
    summary: 更新仿真包草稿或新版本
    operationId: simUpdatePackage
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/KeyPath" }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - version
              - name
              - category
              - scale_limit
              - bundle
            properties:
              code:
                type: string
              version:
                type: string
              name:
                type: string
              category:
                type: string
              scale_limit:
                type: string
                description: JSON 编码的规模上限对象，包含 nodes、max_tick、max_events。
              bundle:
                type: string
                format: binary
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages/{key}/versions:
  get:
    tags: [sim]
    summary: 仿真包版本列表
    operationId: simListPackageVersions
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/KeyPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages/{key}/preview:
  get:
    tags: [sim]
    summary: 仿真包审核前预览
    operationId: simPreviewPackage
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/KeyPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages/{key}/archive:
  post:
    tags: [sim]
    summary: 下架仿真包
    operationId: simArchivePackage
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/KeyPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/packages/{key}/republish:
  post:
    tags: [sim]
    summary: 重新上架仿真包
    operationId: simRepublishPackage
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/KeyPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/reviews:
  get:
    tags: [sim]
    summary: 仿真包审核列表
    description: 每条带提交教师姓名 submitter_name，经身份契约一次批量解析；账号已移除时省略。facets.result：审核结论分段计数。
    operationId: simListReviews
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ name: result, in: query, schema: { type: string } }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/reviews/{id}/approve:
  post:
    tags: [sim]
    summary: 通过仿真包审核
    operationId: simApproveReview
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{$ref: '#/components/parameters/IDPath'}]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/reviews/{id}/reject:
  post:
    tags: [sim]
    summary: 驳回仿真包审核
    operationId: simRejectReview
    x-chaimir-audience: platform-admin
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - comment
            properties:
              comment:
                type: string
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/internal/sessions:
  post:
    tags: [sim]
    summary: 创建仿真会话
    operationId: simCreateSession
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - package_code
              - version
              - owner_account_id
              - scope_ref
            properties:
              package_code:
                type: string
              version:
                type: string
              seed:
                type: integer
              init_params:
                type: object
                additionalProperties: true
              owner_account_id:
                $ref: "#/components/schemas/SnowflakeID"
              authorized_account_ids:
                type: array
                items:
                  $ref: "#/components/schemas/SnowflakeID"
              scope_ref:
                type: string
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/internal/sessions/recycle:
  post:
    tags: [sim]
    summary: 按 scope_ref 批量回收仿真会话
    operationId: simRecycleSessions
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - scope_ref
            properties:
              scope_ref:
                type: string
              reason:
                type: string
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/internal/sessions/{id}:
  delete:
    tags: [sim]
    summary: 回收单个仿真会话
    operationId: simDestroySession
    x-chaimir-audience: internal
    x-chaimir-internal: true
    security: [{ serviceAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/sessions/{id}/actions:
  post:
    tags: [sim]
    summary: 上报仿真操作
    description: 仅浏览器运行会话可上报已执行动作，按连续序号和不递减时刻保存；隔离会话由服务端执行后登记，本接口拒绝写入。
    operationId: simReportAction
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - seq
              - event_type
            properties:
              seq:
                type: integer
              at_tick:
                type: integer
              event_type:
                type: string
              payload:
                type: object
                additionalProperties: true
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/sessions/{id}/replay:
  get:
    tags: [sim]
    summary: 读取仿真回放
    description: 返回固定包版本、种子、初始参数、操作序列及从会话状态派生的 read_only；已归档只能只读回放。
    operationId: simGetReplay
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/sessions/{id}/share:
  post:
    tags: [sim]
    summary: 生成仿真分享码
    operationId: simShareSession
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              expire_at:
                type: string
                format: date-time
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/sim/sessions/{id}/stream:
  get:
    tags: [sim]
    summary: 后端计算仿真流 WebSocket
    description: 可用会话执行受控命令；已归档会话仅复现记录，拒绝 event 注入。服务端帧携带权威 read_only，临时隔离环境随连接回收。
    operationId: simStreamSession
    x-chaimir-audience: user
    x-chaimir-websocket: true
    security: [{ wsTicketAuth: [] }]
    parameters: [{$ref: '#/components/parameters/IDPath'}, {name: ticket, in: query, required: true, schema: {type: string}, description: 通过 /api/v1/auth/ws-ticket 换取的短时路径绑定连接票据}]
    responses: { "101": { description: WebSocket 升级成功 }, default: { $ref: "#/components/responses/Error" } }
