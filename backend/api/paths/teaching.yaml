# 本文件按模块维护 teaching 路径项。
/api/v1/teaching/courses:
  get:
    tags: [teaching]
    summary: 我的课程列表
    operationId: teachingListCourses
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: role, in: query, schema: { type: string } }
      - { $ref: "#/components/parameters/StatusQuery" }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
      - { name: is_shared, in: query, schema: { type: integer, minimum: 0, maximum: 2 } }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
  post:
    tags: [teaching]
    summary: 创建课程
    operationId: teachingCreateCourse
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    requestBody: { $ref: "#/components/requestBodies/ObjectBody" }
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/teaching/courses/shared:
  get:
    tags: [teaching]
    summary: 共享课程目录
    operationId: teachingListSharedCourses
    x-chaimir-audience: teacher
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: keyword, in: query, schema: { type: string } }
      - { $ref: "#/components/parameters/PageQuery" }
      - { $ref: "#/components/parameters/SizeQuery" }
    description: 仅返回其他租户当前共享课程的id/name/description/type/difficulty/semester/credits/updated_at，不包含邀请码与学生业务数据。克隆时重新校验共享状态。
    responses: { "200": { $ref: "#/components/responses/Standard" }, default: { $ref: "#/components/responses/Error" } }
/api/v1/teaching/courses/cover:
  post:
    tags: [teaching]
    summary: 上传课程封面
    operationId: teachingUploadCourseCover
    x-chaimir-audience: teacher
