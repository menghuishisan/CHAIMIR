    description: 主帖与回复使用同一分页流。parent_id表示回复关系，parent_content仅投影同租户、同课程且未删除的父帖正文；父帖删除后回复保留且不返回原文。
    operationId: teachingListPosts
    x-chaimir-audience: user
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: "#/components/parameters/IDPath" }, { $ref: "#/components/parameters/PageQuery" }, { $ref: "#/components/parameters/SizeQuery" }]
