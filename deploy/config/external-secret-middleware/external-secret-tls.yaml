# PostgreSQL TLS 密钥同步,只在包含内置 PostgreSQL 的部署形态中使用。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-tls
  namespace: chaimir-data
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: chaimir-external-secret-store
  target:
    name: postgres-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: {key: chaimir, property: POSTGRES_TLS_CERTIFICATE}
    - secretKey: tls.key
      remoteRef: {key: chaimir, property: POSTGRES_TLS_PRIVATE_KEY}
