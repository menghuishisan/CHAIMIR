# 系统和数据命名空间各自持有 SecretStore,共同只读访问同一个受控密钥源。
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: chaimir-external-secret-store
  namespace: chaimir-system
spec:
  provider:
    kubernetes:
      remoteNamespace: chaimir-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: chaimir-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: chaimir-external-secret-store
  namespace: chaimir-data
spec:
  provider:
    kubernetes:
      remoteNamespace: chaimir-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: chaimir-secret-reader
