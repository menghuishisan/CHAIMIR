# prod-school overlay:私有化单校(k3s),关平台层,单实例中间件随平台交付。
# 依据 docs/总-部署架构设计.md §一/§四/§五/§十:
#   单租户(tenant_id 恒定)、无平台管理员、k3s + 单实例中间件、离线镜像包。
#   私有化 overlay:去掉 /platform 入口、平台级定时任务,初始化脚本建首个学校管理员。
#
# 密钥:私有化用 secretGenerator 从 deploy/config/secret.env(交付时由运维填入,被 .gitignore 忽略)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# 单实例中间件随平台一起部署(校内无托管,k3s 单机全套)。
components:
  - ../../components/middleware

# 私有化密钥由交付运维填入 deploy/config/secret.env。
# 生成两份(命名空间隔离):chaimir-system 给应用,chaimir-data 给中间件。同源,单一来源。
secretGenerator:
  - name: chaimir-secret
    namespace: chaimir-system
    envs:
      - ../../config/secret.env
  - name: chaimir-data-secret
    namespace: chaimir-data
    envs:
      - ../../config/secret.env

# 镜像使用平台统一的不可变 registry digest,离线交付时由运维按同一 digest 导入。
images:
  - name: chaimir/backend
    newName: registry.chaimir.io/service/backend
    digest: sha256:c8febfe6fc3920c089f7191267ebd8538dafa07768147b5c98d20c02acd03217
  - name: chaimir/frontend
    newName: registry.chaimir.io/service/frontend
    digest: sha256:bc5ca0c4238bae8c7731384ecac2ddf60d41d7c12afa10958755e56c63a6e38b
  - name: chaimir/migrate
    newName: registry.chaimir.io/service/migrate
    digest: sha256:32b920e1653766c1be0562f96cf9b26ee995f78c99b01e2c0c765ac7fce57a82
  - name: chaimir/cron
    newName: registry.chaimir.io/service/cron
    digest: sha256:e3f899f23ef51ba911845a09473d4f941e885f7fc767c84f99901ddad2d6a9b8
  - name: chaimir/middleware/clamav
    newName: registry.chaimir.io/middleware/clamav
    digest: sha256:8e1af8fa21a9954abc87aa4c59993a82ec6984ee89bc09097ab9828efddc399a
  - name: chaimir/middleware/minio
    newName: registry.chaimir.io/middleware/minio
    digest: sha256:572a6ab846e59cf2e0b56645c955136107aecef09a365afa237ff127c4646cab
  - name: chaimir/middleware/nats
    newName: registry.chaimir.io/middleware/nats
    digest: sha256:502f6b38e93402ba6049abb388fb86ddb6a3ae1739ac71f1a935e0b5be1f8528
  - name: chaimir/middleware/postgres
    newName: registry.chaimir.io/middleware/postgres
    digest: sha256:8a08cd59bcab2c21965dd8826440e5be1c93a3754de9a7a543a33286b2d2edbe
  - name: chaimir/middleware/redis
    newName: registry.chaimir.io/middleware/redis
    digest: sha256:3f7c4af1c5509dace732614ed08b168d436d8a5c39a1001c3fbb7c1a1290f975

# 私有化形态:school 单租户 + 关平台层。
configMapGenerator:
  - name: chaimir-config
    namespace: chaimir-system
    behavior: merge
    literals:
      - DEPLOY_MODE=school
      - PLATFORM_LAYER_ENABLED=false
      - SCHOOL_TENANT_ID=1001
      - LOG_LEVEL=info
      - PG_SSLMODE=require

patches:
  # 平台统一公网域名;私有化交付也通过同一入口和证书策略接入。
  - target:
      kind: Ingress
      name: chaimir
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.chaimir.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.chaimir.io
  - target:
      kind: Ingress
      name: chaimir-public-deny
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.chaimir.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.chaimir.io
