# prod-school overlay:私有化单校(k3s),关平台层,单实例中间件随平台交付。
# 依据 docs/总-部署架构设计.md §一/§四/§五/§十:
#   单租户(tenant_id 恒定)、无平台管理员、k3s + 单实例中间件、离线镜像包。
#   私有化 overlay:去掉 /platform 入口、平台级定时任务,初始化脚本建首个学校管理员。
#
# 密钥由 External Secrets Operator 从学校受控 SecretStore 同步,本 overlay 不读取密钥文件。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../config/external-secret
  - ../../config/external-secret-middleware
  - ../../config/kubernetes-secret-store

# 单实例中间件随平台一起部署(校内无托管,k3s 单机全套)。
components:
  - ../../components/middleware

# 私有化密钥由统一 ExternalSecret 组件从学校配置的密钥提供方同步。

# 私有化形态:school 单租户 + 关平台层。
configMapGenerator:
  - name: chaimir-config
    namespace: chaimir-system
    behavior: merge
    literals:
      - DEPLOY_MODE=school
      - PLATFORM_LAYER_ENABLED=false
      - SCHOOL_TENANT_ID=1001
