# 本文件定义完整功能验收 overlay;测试数据组件不改变生产安全基线。
# 本 overlay 只承载完整功能验收所需的单实例数据组件与夹具,不降低集群安全标准。
# 一键拉起见 deploy/Makefile(dev-up:装 Cilium/ingress/metrics → apply 本 overlay → 跑 migrate)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../config/external-secret
  - ../../config/external-secret-middleware
  - ../../config/kubernetes-secret-store

# 验收所需中间件单实例随集群拉起;SaaS/staging 使用外接托管服务。
components:
  - ../../components/middleware

# 验收密钥由统一 ExternalSecret 组件从受控密钥提供方同步,本 overlay 不读取密钥文件。

# 完整验收形态:SaaS 多租户 + 平台层开启。
configMapGenerator:
  - name: chaimir-config
    namespace: chaimir-system
    behavior: merge
    literals:
      # test 仅开启验收 seed 与受控短信夹具;集群及应用安全配置仍执行生产基线。
      - APP_ENV=test
      - SMS_HTTP_ENDPOINT=http://sms-gateway.chaimir-system.svc.cluster.local:18080/sms
      - SMS_HTTP_ENDPOINT_SCOPE=cluster
      - SMS_HTTP_CLUSTER_CIDRS=10.96.0.0/12
      - SMS_TEMPLATE_LOGIN=acceptance-login
      - SMS_TEMPLATE_RESET=acceptance-reset
      - SMS_TEMPLATE_CHANGE_PHONE=acceptance-change-phone
