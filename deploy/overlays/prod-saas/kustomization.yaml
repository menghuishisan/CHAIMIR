# prod-saas overlay:SaaS 公网生产,多副本 + HPA,中间件外接,真实证书,KMS 密钥。
# 依据 docs/总-部署架构设计.md §四/§五/§八/§九:多副本水平扩展;托管/集群中间件;
#   全站 HTTPS;密钥经 KMS;tag→人工审批→部署。
#
# 密钥:由 External Secrets/KMS 在集群创建 Secret chaimir-secret(不用 secretGenerator)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml
  # 不 include middleware:生产用托管主从/集群。

components:
  - ../../config/external-secret

images:
  - name: chaimir/backend
    newName: registry.chaimir.io/service/backend
    digest: sha256:810ac6f06f63622bf9f8b35591b2d8b5e238d5eebe31a5a268e510c60d43b155
  - name: chaimir/frontend
    newName: registry.chaimir.io/service/frontend
    digest: sha256:11d50326acbeecba6d25323b72c8ca1d95813d2f65a607fc32ad8906152bbf16
  - name: chaimir/migrate
    newName: registry.chaimir.io/service/migrate
    digest: sha256:5ba33be5e09d596b16766087b331307c5e68af527e3b01202d4221818afb6428
  - name: chaimir/cron
    newName: registry.chaimir.io/service/cron
    digest: sha256:4d1495ff799a26260ad23730acd3c6d0de21fca7fe33de1d631c498175b0603a

configMapGenerator:
  - name: chaimir-frontend-runtime-config
    namespace: chaimir-system
    behavior: replace
    files:
      - runtime-config.js=frontend-runtime-config.js
  - name: chaimir-config
    namespace: chaimir-system
    behavior: merge
    literals:
      - DEPLOY_MODE=saas
      - PLATFORM_LAYER_ENABLED=true
      - LOG_LEVEL=info
      - PG_SSLMODE=require
      - PG_HOST=postgres.prod-data.internal
      - REDIS_HOST=redis.prod-data.internal
      - NATS_URL=nats://nats.prod-data.internal:4222
      - MINIO_ENDPOINT=minio.prod-data.internal:9000
      - UPLOAD_VIRUS_SCAN_ADDRESS=clamav.prod-data.internal:3310

# 生产后端起步 3 副本(HPA 接管伸缩区间)。
replicas:
  - name: chaimir-backend
    count: 3

patches:
  # 生产域名 + TLS + 可选 WAF(cert-manager 签发,WAF 经 ingress 注解可选开启)。
  - target:
      kind: Ingress
      name: chaimir
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.chaimir.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.chaimir.io
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: chaimir-prod-issuer
  - target:
      kind: Ingress
      name: chaimir-public-deny
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: www.chaimir.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: www.chaimir.io
  # prod-saas 密钥 Store 与远端键前缀。ExternalSecret 键集合统一维护在 deploy/config。
  - target:
      kind: ExternalSecret
      name: chaimir-secret
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: chaimir-prod-secret-store
      - op: replace
        path: /spec/refreshInterval
        value: 5m
      - op: replace
        path: /spec/data
        value:
          - secretKey: JWT_SIGNING_KEY
            remoteRef: {key: prod/chaimir/JWT_SIGNING_KEY}
          - secretKey: APP_ENCRYPTION_KEY
            remoteRef: {key: prod/chaimir/APP_ENCRYPTION_KEY}
          - secretKey: APP_HMAC_KEY
            remoteRef: {key: prod/chaimir/APP_HMAC_KEY}
          - secretKey: PG_PASSWORD
            remoteRef: {key: prod/chaimir/PG_PASSWORD}
          - secretKey: PG_PRIV_USER
            remoteRef: {key: prod/chaimir/PG_PRIV_USER}
          - secretKey: PG_PRIV_PASSWORD
            remoteRef: {key: prod/chaimir/PG_PRIV_PASSWORD}
          - secretKey: REDIS_PASSWORD
            remoteRef: {key: prod/chaimir/REDIS_PASSWORD}
          - secretKey: MINIO_ACCESS_KEY
            remoteRef: {key: prod/chaimir/MINIO_ACCESS_KEY}
          - secretKey: MINIO_SECRET_KEY
            remoteRef: {key: prod/chaimir/MINIO_SECRET_KEY}
          - secretKey: NATS_TOKEN
            remoteRef: {key: prod/chaimir/NATS_TOKEN}
          - secretKey: GRADE_TRANSCRIPT_SIGNING_KEY
            remoteRef: {key: prod/chaimir/GRADE_TRANSCRIPT_SIGNING_KEY}
          - secretKey: SMS_HTTP_TOKEN
            remoteRef: {key: prod/chaimir/SMS_HTTP_TOKEN}
          - secretKey: CHAIMIR_WALLET_SIGNER_PRIVATE_KEY
            remoteRef: {key: prod/chaimir/CHAIMIR_WALLET_SIGNER_PRIVATE_KEY}
          - secretKey: CHAIMIR_WALLET_SESSION_SECRET
            remoteRef: {key: prod/chaimir/CHAIMIR_WALLET_SESSION_SECRET}
          - secretKey: CHAIMIR_PAYMASTER_PRIVATE_KEY
            remoteRef: {key: prod/chaimir/CHAIMIR_PAYMASTER_PRIVATE_KEY}
          - secretKey: CHAIMIR_PAYMASTER_SERVICE_AUTH_SECRET
            remoteRef: {key: prod/chaimir/CHAIMIR_PAYMASTER_SERVICE_AUTH_SECRET}
          - secretKey: CHAIMIR_EVENT_LISTENER_SERVICE_AUTH_SECRET
            remoteRef: {key: prod/chaimir/CHAIMIR_EVENT_LISTENER_SERVICE_AUTH_SECRET}
          - secretKey: BOOTSTRAP_ADMIN_PHONE
            remoteRef: {key: prod/chaimir/BOOTSTRAP_ADMIN_PHONE}
          - secretKey: BOOTSTRAP_ADMIN_NAME
            remoteRef: {key: prod/chaimir/BOOTSTRAP_ADMIN_NAME}
          - secretKey: BOOTSTRAP_ADMIN_PASSWORD
            remoteRef: {key: prod/chaimir/BOOTSTRAP_ADMIN_PASSWORD}
          - secretKey: BOOTSTRAP_PLATFORM_ADMIN_PASSWORD
            remoteRef: {key: prod/chaimir/BOOTSTRAP_PLATFORM_ADMIN_PASSWORD}
