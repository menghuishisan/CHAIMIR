# base 层 Kustomize 聚合:平台通用资源(命名空间/RBAC/应用/配置/入口/策略/定时任务)。
# 依据 docs/总-部署架构设计.md §四:base 定义通用资源,overlays 覆盖环境差异。
# 平台服务镜像在本层按不可变 digest 统一锁定,overlay 不得重复覆盖。
# ConfigMap/Secret 由 generator 生成(带哈希后缀,变更自动触发滚动更新)。
#
# 注:networkpolicy/sandbox-template.yaml 为后端运行时模板,故意不列入资源
#   (sbx-*/judge-*/battle-*/sim-* 命名空间部署期不存在)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces/namespaces.yaml
  - rbac/backend-sa.yaml
  - backend/deployment.yaml
  - backend/pdb.yaml
  - backend/rbac-provisioner-deployment.yaml
  - frontend/deployment.yaml
  - migrate/migrate-job.yaml
  - ingress/ingress.yaml
  - networkpolicy/static-namespaces.yaml
  - admission/sandbox-namespace-policy.yaml
  - admission/image-signature-policy.yaml
  - cronjobs/cronjobs.yaml

# 环境变量键:由 config component 从「唯一」env 源 ../config/chaimir.env 生成
#   chaimir-config(chaimir-system)+ chaimir-data-config(chaimir-data)。
# overlay 用 configMapGenerator behavior: merge 覆盖差异键(DEPLOY_MODE 等)。
components:
  - ../config

# 密钥真实值(Secret chaimir-secret / chaimir-data-secret)不放 base:
#   所有形态统一由 ExternalSecret 从环境 SecretStore 同步,provider 由基础设施配置。
# base 资源只引用固定名称,避免把密钥内容纳入 Kustomize 输入或生成哈希名称。
# 受控密钥源输入模板见 config/secret.env.example,实际输入文件不入仓。

# 平台服务镜像引用由镜像晋级脚本从 images/image-digests.lock 同步。
images:
  - name: chaimir/backend
    newName: registry.chaimir.io/service/backend
    digest: sha256:1b0d4f7f1d832dda4d0b4e0526ccfe557d6d9c9158dc9dbfd9a6a15f54548692
  - name: chaimir/frontend
    newName: registry.chaimir.io/service/frontend
    digest: sha256:4ad1b6c61785c6c4c717e475c34d87f52814f796de6d299063b34fb0d873cb04
  - name: chaimir/migrate
    newName: registry.chaimir.io/service/migrate
    digest: sha256:a6e95a04a848416f9faf0ac51fb9fd759270142dfcceb693a7e96886095d6707
  - name: chaimir/cron
    newName: registry.chaimir.io/service/cron
    digest: sha256:dbe9e318e4007e5cf27243e162d9a3fe5d4652fa4b8c987ecf74121e79f2047a

# generator 默认行为:加哈希后缀(配置变更触发滚动)。
generatorOptions:
  disableNameSuffixHash: false

# 统一标签(labels 含 includeSelectors:false,避免污染 Deployment selector/Service selector)。
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
