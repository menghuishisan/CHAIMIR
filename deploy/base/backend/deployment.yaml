# 后端单体 Deployment + Service。
# 依据 docs/总-部署架构设计.md §三:无状态多副本(会话在 Redis、JWT 无状态),
# 经 client-go 创建/销毁动态沙箱 Pod;docs/总-工程目录设计:单控制面二进制 cmd/server。
# 镜像名为逻辑占位 chaimir/backend,由 base 的 images 变换锁定不可变 digest。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaimir-backend
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-backend
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: chaimir
spec:
  replicas: 1  # overlay 覆盖:prod-saas 多副本 + HPA。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaimir-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaimir-backend
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: chaimir
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: chaimir-backend  # 最小 RBAC,管理动态运行命名空间。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: chaimir/backend:placeholder  # 由 base 的 images 变换锁定 digest。
          args: ["serve"]  # 控制面 HTTP/WS 主进程,后台任务由 server 内统一 background runner 承载。
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: chaimir-config
            - secretRef:
                name: chaimir-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # 探针走集群内专用 /-/ 路径,不在任何 Ingress path 内(公网不可达);
          # /api/healthz 仅保留最小公开 liveness。
          # 探针以 HTTP 状态码表达结果(就绪 200 / 不就绪 503),不套业务 JSON 信封 ——
          # 否则恒 200 会让 kubelet 永远判定就绪,依赖故障时仍向本副本送流量。
          readinessProbe:
            httpGet:
              path: /-/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp  # readOnlyRootFilesystem 下提供可写临时目录。
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chaimir-backend
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-backend
    app.kubernetes.io/part-of: chaimir
spec:
  selector:
    app.kubernetes.io/name: chaimir-backend
  ports:
    - name: http
      port: 80
      targetPort: http
