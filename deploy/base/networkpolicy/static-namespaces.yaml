# 静态命名空间 NetworkPolicy:默认 deny-all + 精确放行。
# 依据 docs/总-部署架构设计.md §二/§九:NetworkPolicy 默认 deny-all,按需精确放行;
#   最小权限,系统与数据命名空间严格隔离。
#
# 说明:NetworkPolicy 为命名空间级。本文件覆盖 chaimir-system 与 chaimir-data。
# 动态沙箱命名空间(sbx-*/judge-*/battle-*)的 deny-all 模板见 sandbox-template.yaml;
# M4 sim-* 命名空间由适配器直接创建 deny-all NetworkPolicy,
# 由后端创建沙箱时套用(deploy 提供 SSOT 模板)。

# ===== chaimir-system:默认拒绝所有进出 =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
# 无 ingress/egress 规则 = 全部拒绝。

# ===== chaimir-system:精确放行 =====
---
# 允许 ingress-nginx 访问后端/前端的 http。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["chaimir-backend", "chaimir-frontend"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# 允许 DNS 解析(所有 Pod → kube-dns)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 允许后端/migrate/cron → chaimir-data 中间件端口。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-data
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["control-plane", "migration", "cronjob"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chaimir-data
      ports:
        - protocol: TCP
          port: 5432   # PostgreSQL
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 4222   # NATS
        - protocol: TCP
          port: 9000   # S3 对象存储
        - protocol: TCP
          port: 3310   # ClamAV clamd
---
# 允许后端控制面 → kube-apiserver(client-go 管理动态沙箱)。
# 目标只覆盖集群内 kubernetes Service VIP,禁止把公网 443/6443
# 误当成 apiserver 放行范围;应用使用 in-cluster Service 访问 API。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-apiserver
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["control-plane", "rbac-provisioner"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
---
# Cilium 下 Kubernetes Service VIP 会在数据面转换为 kube-apiserver 实体。
# 原生 NetworkPolicy 的 Service CIDR 放行不能覆盖该转换路径,因此对真正需要
# client-go 的控制面补充同等端口范围的 Cilium 策略;不放行节点或公网地址。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-control-plane-to-kube-apiserver
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["control-plane", "rbac-provisioner"]
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# 允许后端控制面访问动态沙箱命名空间内由后端显式放行的运行时/工具端口。
# 出站侧仅限定到 Chaimir 管理的动态命名空间;目标 Pod 与端口仍由动态命名空间内
# sandbox-allow-control-plane-* ingress 策略按 runtime/tool 声明精确约束。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-managed-sandboxes
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["control-plane"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: chaimir
              chaimir.io/sandbox: "true"

# ===== chaimir-data:默认拒绝 + 仅放行来自 chaimir-system =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: chaimir-data
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 中间件仅接受来自 chaimir-system 的连接;命名空间内部互通(集群中间件需要)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-system
  namespace: chaimir-data
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chaimir-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chaimir-data
---
# chaimir-data 内 DNS + 命名空间内部互通(中间件集群/备份需要)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-internal-egress
  namespace: chaimir-data
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chaimir-data
---
# ClamAV 首次启动和定期更新只访问官方病毒库域名;默认拒绝仍阻断其他公网出口。
# DNS 规则开启 Cilium DNS 代理,使 toFQDNs 能按实际解析结果建立短时 IP 允许集。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-clamav-virus-database-egress
  namespace: chaimir-data
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: clamav
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: database.clamav.net
              - matchPattern: "*.clamav.net"
    - toFQDNs:
        - matchName: database.clamav.net
        - matchPattern: "*.clamav.net"
        - matchPattern: "*.clamav.net.cdn.cloudflare.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
