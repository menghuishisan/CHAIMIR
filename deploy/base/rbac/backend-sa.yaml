# 后端单体与沙箱 RBAC 资源,工作负载权限由独立命名空间预配器按命名空间授予。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaimir-backend
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-backend
    app.kubernetes.io/part-of: chaimir
imagePullSecrets:
  - name: chaimir-harbor-pull
---
# 后端仅负责动态命名空间生命周期和调度/快照能力探测,不直接持有工作负载权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimir-backend-sandbox-ns
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # 后端只读取预配器创建的固定 RoleBinding,把最小权限就绪作为创建工作负载的门禁。
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["chaimir-backend-sandbox-workload"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaimir-backend-sandbox-ns
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaimir-backend-sandbox-ns
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
---
# 部署管理员维护固定工作负载权限,RoleBinding 绑定后仅在单个动态命名空间内生效。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimir-backend-sandbox-workload
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/status"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "delete", "get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "resourcequotas", "limitranges"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
---
# 预配器只观察 Namespace,并在受标签保护的动态 Namespace 内修复固定 RoleBinding。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaimir-sandbox-rbac-provisioner
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-sandbox-rbac-provisioner
    app.kubernetes.io/part-of: chaimir
imagePullSecrets:
  - name: chaimir-harbor-pull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimir-sandbox-rbac-provisioner
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get", "update"]
  # 仅允许把部署层固定 ClusterRole 绑定到动态命名空间,不授予创建或升级 Role 的能力。
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["chaimir-backend-sandbox-workload"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaimir-sandbox-rbac-provisioner
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaimir-sandbox-rbac-provisioner
subjects:
  - kind: ServiceAccount
    name: chaimir-sandbox-rbac-provisioner
    namespace: chaimir-system
---
# 后端只读取固定 Harbor 拉取凭据,避免读取控制命名空间中的 JWT/数据库等 Secret。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaimir-backend-image-pull-source
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["chaimir-harbor-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaimir-backend-image-pull-source
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaimir-backend-image-pull-source
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
---
# 预拉取 DaemonSet 只能在固定命名空间内管理,不扩大到其他静态命名空间。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaimir-backend-prepull-workload
  namespace: chaimir-prepull
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "delete", "get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # 静态命名空间中的固定拉取凭据由部署流程预创建,后端仅校验并同步凭据轮换。
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["chaimir-harbor-pull"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaimir-backend-prepull-workload
  namespace: chaimir-prepull
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaimir-backend-prepull-workload
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
