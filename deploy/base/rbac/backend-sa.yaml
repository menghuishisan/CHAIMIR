# 后端单体与沙箱 RBAC 资源,工作负载权限由独立命名空间预配器按命名空间授予。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaimir-backend
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-backend
    app.kubernetes.io/part-of: chaimir
imagePullSecrets:
  - name: chaimir-harbor-pull
---
# 后端仅负责动态命名空间生命周期和调度/快照能力探测,不直接持有工作负载权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimir-backend-sandbox-ns
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaimir-backend-sandbox-ns
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaimir-backend-sandbox-ns
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
---
# 预配器只观察 Namespace,并在受标签保护的动态 Namespace 内修复固定 Role/RoleBinding。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaimir-sandbox-rbac-provisioner
  namespace: chaimir-system
  labels:
    app.kubernetes.io/name: chaimir-sandbox-rbac-provisioner
    app.kubernetes.io/part-of: chaimir
imagePullSecrets:
  - name: chaimir-harbor-pull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaimir-sandbox-rbac-provisioner
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaimir-sandbox-rbac-provisioner
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaimir-sandbox-rbac-provisioner
subjects:
  - kind: ServiceAccount
    name: chaimir-sandbox-rbac-provisioner
    namespace: chaimir-system
---
# 后端只读取固定 Harbor 拉取凭据,避免读取控制命名空间中的 JWT/数据库等 Secret。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaimir-backend-image-pull-source
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["chaimir-harbor-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaimir-backend-image-pull-source
  namespace: chaimir-system
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaimir-backend-image-pull-source
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
---
# 预拉取 DaemonSet 只能在固定命名空间内管理,不扩大到其他静态命名空间。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaimir-backend-prepull-workload
  namespace: chaimir-prepull
  labels:
    app.kubernetes.io/part-of: chaimir
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "delete", "get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaimir-backend-prepull-workload
  namespace: chaimir-prepull
  labels:
    app.kubernetes.io/part-of: chaimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaimir-backend-prepull-workload
subjects:
  - kind: ServiceAccount
    name: chaimir-backend
    namespace: chaimir-system
