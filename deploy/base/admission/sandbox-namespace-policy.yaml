# 动态运行工作负载命名空间准入策略。
# 依据 docs/总-部署架构设计.md §二/§九:后端 ServiceAccount 只能操作 sbx-*/judge-*/battle-*/sim-* 动态命名空间。
# Kubernetes RBAC 无法用通配符限制 namespace 名称,因此用 ValidatingAdmissionPolicy 在准入层强制约束。
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaimir-sandbox-namespace-boundary
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  validations:
    - expression: >
        !(
          request.name.startsWith('sbx-') ||
          request.name.startsWith('judge-') ||
          request.name.startsWith('battle-') ||
          request.name.startsWith('sim-')
        ) ||
        (
          request.userInfo.username == 'system:serviceaccount:chaimir-system:chaimir-backend' ||
          request.userInfo.groups.exists(group, group == 'system:masters')
        )
      message: "动态运行命名空间前缀仅保留给 Chaimir 后端创建。"
    - expression: >
        !(
          (request.operation == 'DELETE' ? oldObject : object).metadata.labels.exists(key, value,
            key == 'chaimir.io/managed-by' && value == 'chaimir-backend'
          )
        ) ||
        (
          request.userInfo.username == 'system:serviceaccount:chaimir-system:chaimir-backend' ||
          request.userInfo.groups.exists(group, group == 'system:masters')
        )
      message: "只有 Chaimir 后端 ServiceAccount 可以创建、修改或删除平台所有权命名空间。"
    - expression: >
        !(
          request.userInfo.username == 'system:serviceaccount:chaimir-system:chaimir-backend'
        ) ||
        (
          request.name.startsWith('sbx-') ||
          request.name.startsWith('judge-') ||
          request.name.startsWith('battle-') ||
          request.name.startsWith('sim-')
        )
      message: "Chaimir 后端只能管理 sbx-/judge-/battle-/sim- 前缀的动态运行命名空间。"
    - expression: >
        !(
          request.userInfo.username == 'system:serviceaccount:chaimir-system:chaimir-backend' &&
          request.operation in ['CREATE', 'UPDATE']
        ) ||
        (
          object.metadata.labels.exists(key, value,
            key == 'app.kubernetes.io/part-of' && value == 'chaimir'
          ) &&
          object.metadata.labels.exists(key, value,
            key == 'chaimir.io/managed-by' && value == 'chaimir-backend'
          ) &&
          (
            (
              (
                request.name.startsWith('sbx-') ||
                request.name.startsWith('judge-') ||
                request.name.startsWith('battle-')
              ) &&
              'chaimir.io/sandbox' in object.metadata.labels &&
              object.metadata.labels['chaimir.io/sandbox'] == 'true'
            ) ||
            (
              request.name.startsWith('sim-') &&
              'chaimir.io/sim' in object.metadata.labels &&
              object.metadata.labels['chaimir.io/sim'] == 'true'
            )
          )
        )
      message: "Chaimir 动态运行命名空间必须带对应引擎的平台所有权标签。"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaimir-sandbox-namespace-boundary
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  policyName: chaimir-sandbox-namespace-boundary
  validationActions: ["Deny"]
---
# 预配器即使被入侵,也只能在动态命名空间把固定 ClusterRole 绑定给固定后端主体。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaimir-sandbox-rbac-boundary
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  validations:
    - expression: >
        request.userInfo.username != 'system:serviceaccount:chaimir-system:chaimir-sandbox-rbac-provisioner' ||
        (
          (
            request.namespace.startsWith('sbx-') ||
            request.namespace.startsWith('judge-') ||
            request.namespace.startsWith('battle-') ||
            request.namespace.startsWith('sim-')
          ) &&
          request.name == 'chaimir-backend-sandbox-workload' &&
          object.roleRef.kind == 'ClusterRole' &&
          object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
          object.roleRef.name == 'chaimir-backend-sandbox-workload' &&
          size(object.subjects) == 1 &&
          object.subjects[0].kind == 'ServiceAccount' &&
          object.subjects[0].namespace == 'chaimir-system' &&
          object.subjects[0].name == 'chaimir-backend'
        )
      message: "沙箱 RBAC 预配器只能维护固定动态命名空间内的最小控制面绑定。"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaimir-sandbox-rbac-boundary
  labels:
    app.kubernetes.io/part-of: chaimir
spec:
  policyName: chaimir-sandbox-rbac-boundary
  validationActions: ["Deny"]
