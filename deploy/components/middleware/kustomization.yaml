# 中间件 Kustomize Component(PG/Redis/NATS/S3 对象存储/ClamAV 单实例)。
# 依据 docs/总-部署架构设计.md §五:私有化与验收使用单实例中间件;
#   SaaS/staging 用托管/集群(不 include 本 component,overlay 经 ConfigMap 接外部端点)。
# 以 Component 形式提供,供 overlays/acceptance 与 overlays/prod-school 按需 include。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - postgres.yaml
  - redis.yaml
  - nats.yaml
  - rustfs.yaml
  - clamav.yaml

# 中间件镜像引用由镜像晋级脚本从 images/image-digests.lock 同步。
images:
  - name: chaimir/infra/clamav
    newName: registry.chaimir.io/infra/clamav
    # digest 由 images/sync-image-metadata.ps1 在正式晋升后写入
  - name: chaimir/infra/rustfs
    newName: registry.chaimir.io/infra/rustfs
    # digest 由 images/sync-image-metadata.ps1 在正式晋升后写入
  - name: chaimir/infra/nats
    newName: registry.chaimir.io/infra/nats
    # digest 由 images/sync-image-metadata.ps1 在正式晋升后写入
  - name: chaimir/infra/postgres
    newName: registry.chaimir.io/infra/postgres
    # digest 由 images/sync-image-metadata.ps1 在正式晋升后写入
  - name: chaimir/infra/redis
    newName: registry.chaimir.io/infra/redis
    # digest 由 images/sync-image-metadata.ps1 在正式晋升后写入

# 注:chaimir-data-config(PG 库名/用户等非密值)由 deploy/config 这个 config component
#   从「唯一」env 源 chaimir.env 统一生成,本 component 不再单独生成,避免重复定义。
# 密钥 chaimir-data-secret 由 External Secrets Operator 从受控 SecretStore 同步。
