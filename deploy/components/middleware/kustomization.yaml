# 中间件 Kustomize Component(PG/Redis/NATS/MinIO/ClamAV 单实例)。
# 依据 docs/总-部署架构设计.md §五:私有化与验收使用单实例中间件;
#   SaaS/staging 用托管/集群(不 include 本 component,overlay 经 ConfigMap 接外部端点)。
# 以 Component 形式提供,供 overlays/acceptance 与 overlays/prod-school 按需 include。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - postgres.yaml
  - redis.yaml
  - nats.yaml
  - minio.yaml
  - clamav.yaml

# 中间件镜像引用由镜像晋级脚本从 images/image-digests.lock 同步。
images:
  - name: chaimir/middleware/clamav
    newName: registry.chaimir.io/middleware/clamav
    digest: sha256:5eeae8652cff5a00d4321628345bd53bb0488f285e7f038a49cdc4042a3f1445
  - name: chaimir/middleware/minio
    newName: registry.chaimir.io/middleware/minio
    digest: sha256:6bb4539a21e09550a3b2bad4fe4ecca07a655200ff5bbf700158316f094d48c0
  - name: chaimir/middleware/nats
    newName: registry.chaimir.io/middleware/nats
    digest: sha256:c8a1fe28c2b1d1e69189471582973d5b13b79835bcd1ac717f760610f981935b
  - name: chaimir/middleware/postgres
    newName: registry.chaimir.io/middleware/postgres
    digest: sha256:344e6a15f1d778db725d5c6bbbb3ce384872222c1bfe13d003476582b9625da7
  - name: chaimir/middleware/redis
    newName: registry.chaimir.io/middleware/redis
    digest: sha256:55a24360a131488be0c49a877af45d63d4cdd7919cb972765e59e9390324a7e1

# 注:chaimir-data-config(PG 库名/用户等非密值)由 deploy/config 这个 config component
#   从「唯一」env 源 chaimir.env 统一生成,本 component 不再单独生成,避免重复定义。
# 密钥 chaimir-data-secret 由 External Secrets Operator 从受控 SecretStore 同步。
