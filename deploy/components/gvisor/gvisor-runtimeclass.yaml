# gVisor 隔离运行时 RuntimeClass:不可信沙箱 Pod(运行学生代码/工具)强制通过 runtimeClassName 引用本资源。
# 后端 SANDBOX_RUNTIME_CLASS 必须等于此 metadata.name。handler 必须与节点 containerd 注册的 runsc 处理器名一致
# (由本组件的安装器 DaemonSet 写入 containerd 配置)。
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: chaimir
    chaimir.io/purpose: sandbox-isolation
handler: runsc
