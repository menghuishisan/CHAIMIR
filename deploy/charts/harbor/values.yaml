# Harbor 官方 Helm chart 的非密 values;密钥由 supply-chain.secret.env 或 KMS 注入。
externalURL: https://registry.chaimir.io
harborAdminPassword: ""
imagePullPolicy: IfNotPresent

# bootstrap.lock.json 固定当前闭包；指标出口关闭时 exporter 不得被 chart 隐式创建。
metrics:
  enabled: false

expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    hosts:
      core: registry.chaimir.io
    className: nginx
    annotations:
      # Docker Desktop 的 canonical 443 入口已完成 TLS 终止；在此处再次强制
      # 重定向会让 registry blob HEAD 回到同一 HTTPS URL，导致 BuildKit 重定向循环。
      ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 120Gi
    database:
      size: 20Gi
    redis:
      size: 5Gi
    jobservice:
      jobLog:
        size: 10Gi
    trivy:
      size: 20Gi

trivy:
  enabled: true
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  skipUpdate: true
  offlineScan: true
  timeout: 15m0s

notary:
  enabled: false

core:
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6

registry:
  registry:
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6

database:
  internal:
    # 密码只能由 harbor-up 从供应链 Secret 注入；空值必须使安装失败，禁止 chart 默认 changeit。
    password: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    shmSizeLimit: 1Gi
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
  maxIdleConns: 50
  maxOpenConns: 200

redis:
  internal:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
