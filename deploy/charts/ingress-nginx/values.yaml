# 本文件固定 ingress-nginx 官方 Helm chart 的生产安全基线;控制器 digest 由部署入口从正式锁注入。
controller:
  kind: Deployment
  replicaCount: 2
  minAvailable: 1
  image:
    registry: registry.chaimir.io
    image: ingress/ingress-nginx
    tag: controller-v1.15.10
    digest: ""
    pullPolicy: IfNotPresent
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 82
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
  ingressClassResource:
    name: nginx
    enabled: true
    default: false
    controllerValue: k8s.io/ingress-nginx
  service:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail
    createSecretJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 100m
          memory: 64Mi
    patchWebhookJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 100m
          memory: 64Mi
    patch:
      enabled: true
      image:
        registry: registry.k8s.io
        image: ingress-nginx/kube-webhook-certgen
        tag: v1.6.9
        digest: sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd
        pullPolicy: IfNotPresent

imagePullSecrets:
  - name: chaimir-harbor-pull

serviceAccount:
  create: true
  automountServiceAccountToken: true

rbac:
  create: true
  scope: false
