# 镜像流水线:按依赖构建运行时、平台设施及迁移/运维镜像；backend/frontend 由专用流水线负责。
# 依据 docs/总-部署架构设计.md §六 + docs/总-镜像与容器设计.md:
#   按依赖分批并行构建；后续批次使用当前运行中已验证的上游 digest。
# 路径触发:通用镜像源码、manifest 或共享供应链实现变化时运行。
name: images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "!images/image-digests.lock"
      - "!images/service/backend/**"
      - "!images/service/frontend/**"
      - "!images/service/migrate/**"
      - "!images/service/cron/**"
      - ".github/workflows/images.yml"
      - ".github/workflows/image-build-wave.yml"
      - "deploy/ci/**"
  pull_request:
    paths:
      - "images/**"
      - "!images/image-digests.lock"
      - "!images/service/backend/**"
      - "!images/service/frontend/**"
      - "!images/service/migrate/**"
      - "!images/service/cron/**"
      - ".github/workflows/images.yml"
      - ".github/workflows/image-build-wave.yml"
      - "deploy/ci/**"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      wave_0: ${{ steps.set.outputs.wave_0 }}
      wave_1: ${{ steps.set.outputs.wave_1 }}
      wave_2: ${{ steps.set.outputs.wave_2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验 manifest、Dockerfile 与 digest lock 契约
        shell: pwsh
        run: ./images/validate-image-metadata.ps1 -RepoRoot . -AllowUnpromoted
      - id: set
        name: 生成通用镜像构建矩阵
        shell: pwsh
        run: |
          Import-Module ./images/lib/ImageMetadata.psm1
          $root = (Get-Location).Path
          $catalog = Get-ChaimirImageCatalog -ImagesRoot (Join-Path $root 'images')
          $services = @('service/backend', 'service/frontend', 'service/migrate', 'service/cron')
          $items = @{}
          $dependencies = @{}
          foreach ($entry in ($catalog.Values | Sort-Object Image)) {
              if (-not $entry.Deployable -or $entry.SourceType -eq 'upstream-pinned' -or $entry.Image -in $services) { continue }
              $build = Get-ChaimirYamlBlock -Path $entry.Manifest -BlockName 'build'
              $paths = Resolve-ChaimirImageBuildPaths -RepoRoot $root -ManifestPath $entry.Manifest -ContextValue (Get-ChaimirYamlValue -Lines $build -Key 'context') -DockerfileValue (Get-ChaimirYamlValue -Lines $build -Key 'dockerfile')
              $sources = Get-ChaimirImageBuildSources -ManifestPath $entry.Manifest -DockerfileText (Get-Content -LiteralPath $paths.Dockerfile -Raw)
              $dependencies[$entry.Image] = @($sources.Values | Where-Object { -not $_.Contains('@') })
              $items[$entry.Image] = @{
                  logical = $entry.Image
                  safe = $entry.Image.Replace('/', '-')
                  context = (Resolve-Path -LiteralPath $paths.Context -Relative).Replace('\', '/')
                  dockerfile = (Resolve-Path -LiteralPath $paths.Dockerfile -Relative).Replace('\', '/')
              }
          }
          foreach ($image in $items.Keys) {
              $items[$image].required_candidates = (@($dependencies[$image] | Where-Object { $items.ContainsKey($_) }) -join ' ')
          }
          $waves = @(Get-ChaimirImageBuildWaves -Dependencies $dependencies)
          if ($waves.Count -eq 0 -or $waves.Count -gt 3) { throw "通用镜像依赖需要 $($waves.Count) 批，流水线支持 1–3 批" }
          for ($index = 0; $index -lt 3; $index++) {
              $entries = @(if ($index -lt $waves.Count) { foreach ($image in $waves[$index].Images) { $items[$image] } })
              $matrix = ConvertTo-Json -Compress -Depth 4 -InputObject @{ include = $entries }
              "wave_$index=$matrix" >> $env:GITHUB_OUTPUT
          }

  build-wave-0:
    needs: discover
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover.outputs.wave_0 != '{"include":[]}'
    uses: ./.github/workflows/image-build-wave.yml
    with:
      matrix: ${{ needs.discover.outputs.wave_0 }}
    secrets:
      registry: ${{ secrets.HARBOR_REGISTRY }}
      registry-username: ${{ secrets.HARBOR_USERNAME }}
      registry-password: ${{ secrets.HARBOR_PASSWORD }}
      cosign-key: ${{ secrets.COSIGN_KEY }}
      cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  build-wave-1:
    needs: [discover, build-wave-0]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover.outputs.wave_1 != '{"include":[]}'
    uses: ./.github/workflows/image-build-wave.yml
    with:
      matrix: ${{ needs.discover.outputs.wave_1 }}
      download-candidates: true
    secrets:
      registry: ${{ secrets.HARBOR_REGISTRY }}
      registry-username: ${{ secrets.HARBOR_USERNAME }}
      registry-password: ${{ secrets.HARBOR_PASSWORD }}
      cosign-key: ${{ secrets.COSIGN_KEY }}
      cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  build-wave-2:
    needs: [discover, build-wave-1]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover.outputs.wave_2 != '{"include":[]}'
    uses: ./.github/workflows/image-build-wave.yml
    with:
      matrix: ${{ needs.discover.outputs.wave_2 }}
      download-candidates: true
    secrets:
      registry: ${{ secrets.HARBOR_REGISTRY }}
      registry-username: ${{ secrets.HARBOR_USERNAME }}
      registry-password: ${{ secrets.HARBOR_PASSWORD }}
      cosign-key: ${{ secrets.COSIGN_KEY }}
      cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  merge-digest-batch:
    needs: [discover, build-wave-0, build-wave-1, build-wave-2]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.discover.result == 'success' && needs.build-wave-0.result == 'success' &&
      (needs.build-wave-1.result == 'success' || needs.discover.outputs.wave_1 == '{"include":[]}') &&
      (needs.build-wave-2.result == 'success' || needs.discover.outputs.wave_2 == '{"include":[]}')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 下载镜像 digest 锁片段
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-digest-*
          path: image-digest-artifacts
          merge-multiple: true
      - name: 合并通用镜像 digest 批次
        shell: pwsh
        env:
          WAVE_0: ${{ needs.discover.outputs.wave_0 }}
          WAVE_1: ${{ needs.discover.outputs.wave_1 }}
          WAVE_2: ${{ needs.discover.outputs.wave_2 }}
        run: |
          Import-Module ./images/lib/ImageMetadata.psm1
          $items = Read-ChaimirDigestFragments -Directory ./image-digest-artifacts
          $expected = @(foreach ($wave in @($env:WAVE_0, $env:WAVE_1, $env:WAVE_2)) { (ConvertFrom-Json $wave).include | ForEach-Object { $_.logical } })
          if ($items.Count -ne $expected.Count -or ($expected | Where-Object { -not $items.ContainsKey($_) })) {
              throw 'digest 批次与构建矩阵不一致，拒绝发布片段'
          }
          Write-ChaimirDigestLock -Path ./image-digest-batch/common.lock -Items $items
      - name: 上传通用镜像 digest 批次
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-common-batch
          path: image-digest-batch/common.lock
          if-no-files-found: error
