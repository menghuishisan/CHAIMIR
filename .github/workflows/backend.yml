# 后端镜像流水线:lint + 单测 → 构建 → Trivy/SBOM → 推 Harbor → Cosign 签名/证明/验证。
# 依据 docs/总-部署架构设计.md §六:路径触发,backend 各自流水线。
# 路径触发:后端源码/服务镜像或其正式基座 digest 变化时运行;服务自身 digest 晋升不回环构建。
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "images/service/backend/**"
      - "images/service/migrate/**"
      - "images/service/cron/**"
      - "images/image-digests.lock"
      - ".github/workflows/backend.yml"
      - "deploy/ci/**"
  pull_request:
    paths:
      - "backend/**"
      - "images/service/backend/**"
      - "images/service/migrate/**"
      - "images/service/cron/**"
      - "images/image-digests.lock"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

env:
  BENCHMARK_MAX_SEC_OP_REGRESSION_PERCENT: "10"
  BENCHMARK_MAX_BYTES_OP_REGRESSION_PERCENT: "5"
  BENCHMARK_MAX_ALLOCS_OP_REGRESSION_PERCENT: "5"

jobs:
  detect-image-build:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: detect
        name: 判断后端服务镜像是否需要重建
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          source_changed=false
          if git diff --name-only "$base" HEAD | grep -Eq '^(backend/|images/service/(backend|migrate|cron)/|\.github/workflows/backend\.yml$|deploy/ci/)'; then
            source_changed=true
          fi
          dependencies=(base/go-builder base/runtime-min middleware/postgres)
          dependency_changed=false
          for dependency in "${dependencies[@]}"; do
            previous_digest="$(git show "$base:images/image-digests.lock" 2>/dev/null | awk -v image="$dependency" '$1 == image { print $2 }')"
            current_digest="$(awk -v image="$dependency" '$1 == image { print $2 }' images/image-digests.lock)"
            if [[ ! "$current_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "images/image-digests.lock 缺少有效 $dependency digest" >&2
              exit 1
            fi
            if [[ "$previous_digest" != "$current_digest" ]]; then
              dependency_changed=true
            fi
          done
          required=false
          if [[ "$source_changed" == "true" || "$dependency_changed" == "true" ]]; then
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  lint-test:
    needs: detect-image-build
    if: needs.detect-image-build.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: 静态检查(go vet + golangci-lint)
        working-directory: backend
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      - name: 源码安全扫描(gosec + govulncheck)
        working-directory: backend
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -nosec=false -severity low -confidence low -exclude-generated ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: 后端构建与仓库内测试
        working-directory: backend
        run: go test ./... -race -count=1
      - name: 性能基准回归门禁
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi

          benchmark_base="$RUNNER_TEMP/chaimir-benchmark-base"
          git worktree add --detach "$benchmark_base" "$base"
          trap 'git worktree remove --force "$benchmark_base"' EXIT
          for source in \
            pkg/chainassert/chainassert_benchmark_test.go \
            pkg/crypto/hash_benchmark_test.go \
            pkg/snowflake/snowflake_benchmark_test.go; do
            install -D "$source" "$benchmark_base/backend/$source"
          done

          benchmark_packages=(./pkg/chainassert ./pkg/crypto ./pkg/snowflake)
          benchmark_args=(-run '^$' -bench '^Benchmark' -benchmem -count=6 -benchtime=500ms)
          (
            cd "$benchmark_base/backend"
            go test "${benchmark_packages[@]}" "${benchmark_args[@]}"
          ) | tee benchmark-base.txt
          go test "${benchmark_packages[@]}" "${benchmark_args[@]}" | tee benchmark-current.txt

          benchstat_version='v0.0.0-20260819171926-ebcb4798430d'
          go run "golang.org/x/perf/cmd/benchstat@$benchstat_version" benchmark-base.txt benchmark-current.txt | tee benchmark-comparison.txt
          go run "golang.org/x/perf/cmd/benchstat@$benchstat_version" -format csv benchmark-base.txt benchmark-current.txt > benchmark-comparison.csv

          awk -F, \
            -v sec_limit="$BENCHMARK_MAX_SEC_OP_REGRESSION_PERCENT" \
            -v bytes_limit="$BENCHMARK_MAX_BYTES_OP_REGRESSION_PERCENT" \
            -v allocs_limit="$BENCHMARK_MAX_ALLOCS_OP_REGRESSION_PERCENT" '
            $2 == "sec/op" || $2 == "B/op" || $2 == "allocs/op" { metric=$2; next }
            $1 == "" || $1 == "geomean" || $6 == "~" || $6 == "" { next }
            $6 ~ /^\+/ {
              delta=$6
              gsub(/[+%]/, "", delta)
              limit=(metric == "sec/op" ? sec_limit : (metric == "B/op" ? bytes_limit : allocs_limit))
              if ((delta + 0) > limit) {
                printf "性能回归超限: %s %s %s (阈值 %s%%)\n", $1, metric, $6, limit > "/dev/stderr"
                failed=1
              }
            }
            END { exit failed }
          ' benchmark-comparison.csv
      - name: 上传性能基准结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-benchmark-${{ github.sha }}
          path: |
            backend/benchmark-base.txt
            backend/benchmark-current.txt
            backend/benchmark-comparison.txt
            backend/benchmark-comparison.csv
      - name: 全仓源码契约审查
        run: node scripts/audit/index.mjs --source-only

  build-push:
    # 仅 main 推送且测试通过后构建推送(PR 只验证不推送)。
    needs: [detect-image-build, lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-image-build.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - id: build-dependencies
        name: 读取后端服务不可变依赖
        shell: bash
        run: |
          set -euo pipefail
          read_digest() {
            local logical="$1"
            local digest
            digest="$(awk -v image="$logical" '$1 == image { print $2 }' images/image-digests.lock)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "images/image-digests.lock 缺少有效 $logical digest" >&2
              exit 1
            fi
            printf '%s' "$digest"
          }
          echo "go_builder=${{ secrets.HARBOR_REGISTRY }}/base/go-builder@$(read_digest base/go-builder)" >> "$GITHUB_OUTPUT"
          echo "runtime=${{ secrets.HARBOR_REGISTRY }}/base/runtime-min@$(read_digest base/runtime-min)" >> "$GITHUB_OUTPUT"
          echo "postgres=${{ secrets.HARBOR_REGISTRY }}/middleware/postgres@$(read_digest middleware/postgres)" >> "$GITHUB_OUTPUT"
      - name: 构建+扫描+签名+推送(backend)
        id: backend-image
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/backend
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/backend/Dockerfile
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.build-dependencies.outputs.go_builder }}
            RUNTIME_IMAGE=${{ steps.build-dependencies.outputs.runtime }}
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 构建+扫描+签名+推送(migrate)
        id: migrate-image
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/migrate
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/migrate/Dockerfile
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.build-dependencies.outputs.go_builder }}
            RUNTIME_IMAGE=${{ steps.build-dependencies.outputs.runtime }}
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 构建+扫描+签名+推送(cron)
        id: cron-image
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/cron
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/cron/Dockerfile
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.build-dependencies.outputs.go_builder }}
            PG_CLIENT_IMAGE=${{ steps.build-dependencies.outputs.postgres }}
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 写入后端服务 digest 片段
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-digest-artifacts
          printf '%s %s\n' 'service/backend' '${{ steps.backend-image.outputs.digest }}' > image-digest-artifacts/service-backend.lock
          printf '%s %s\n' 'service/migrate' '${{ steps.migrate-image.outputs.digest }}' > image-digest-artifacts/service-migrate.lock
          printf '%s %s\n' 'service/cron' '${{ steps.cron-image.outputs.digest }}' > image-digest-artifacts/service-cron.lock
      - name: 上传后端服务 digest 片段
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-backend-services
          path: image-digest-artifacts/*.lock
