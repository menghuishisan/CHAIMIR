# 后端镜像流水线:lint + 单测 → 构建 → Trivy/SBOM → 推 Harbor → Cosign 签名/证明/验证。
# 依据 docs/总-部署架构设计.md §六:路径触发,backend 各自流水线。
# 路径触发:按服务源码、迁移内置manifest及正式基座选择消费者;服务自身digest晋升不回环构建。
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "images/service/backend/**"
      - "images/service/migrate/**"
      - "images/service/cron/**"
      - "images/tool/**/manifest.yaml"
      - "images/infra/**/manifest.yaml"
      - "images/runtime/**/manifest.yaml"
      - "images/judger/**/manifest.yaml"
      - "images/image-digests.lock"
      - ".github/workflows/backend.yml"
      - "deploy/ci/**"
      - "images/lib/ImageMetadata.psm1"
  pull_request:
    paths:
      - "backend/**"
      - "images/service/backend/**"
      - "images/service/migrate/**"
      - "images/service/cron/**"
      - "images/tool/**/manifest.yaml"
      - "images/infra/**/manifest.yaml"
      - "images/runtime/**/manifest.yaml"
      - "images/judger/**/manifest.yaml"
      - "images/image-digests.lock"
      - ".github/workflows/backend.yml"
      - "deploy/ci/**"
      - "images/lib/ImageMetadata.psm1"

permissions:
  contents: read

env:
  BENCHMARK_MAX_SEC_OP_REGRESSION_PERCENT: "10"
  BENCHMARK_MAX_BYTES_OP_REGRESSION_PERCENT: "5"
  BENCHMARK_MAX_ALLOCS_OP_REGRESSION_PERCENT: "5"

jobs:
  detect-image-build:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
      backend_required: ${{ steps.detect.outputs.backend_required }}
      migrate_required: ${{ steps.detect.outputs.migrate_required }}
      cron_required: ${{ steps.detect.outputs.cron_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: detect
        name: 判断后端服务镜像是否需要重建
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          changed_paths="$(git diff --name-only "$base" HEAD)"
          backend_required=false
          migrate_required=false
          cron_required=false
          # 后端流水线独占三个 service 镜像；通用 images 流水线不再重复构建。
          if printf '%s\n' "$changed_paths" | grep -E '^(backend/|\.github/workflows/backend\.yml$)' >/dev/null; then
            backend_required=true
            migrate_required=true
            cron_required=true
          fi
          if printf '%s\n' "$changed_paths" | grep -E '^(deploy/ci/|images/lib/ImageMetadata\.psm1$)' >/dev/null; then
            backend_required=true
            migrate_required=true
            cron_required=true
          fi
          if printf '%s\n' "$changed_paths" | grep -E '^images/service/backend/' >/dev/null; then
            backend_required=true
          fi
          if printf '%s\n' "$changed_paths" | grep -E '^images/service/migrate/' >/dev/null; then
            migrate_required=true
          fi
          if printf '%s\n' "$changed_paths" | grep -E '^images/service/cron/' >/dev/null; then
            cron_required=true
          fi
          # migrate 镜像把平台 manifest 作为运行期目录复制进镜像。
          if printf '%s\n' "$changed_paths" | grep -E '^images/(tool|infra|runtime|judger)/.+/manifest\.yaml$' >/dev/null; then
            migrate_required=true
          fi
          service_digest_stale() {
            local service="$1"
            local previous current
            previous="$(git show "$base:images/image-digests.lock" 2>/dev/null | awk -v image="$service" '$1 == image { print $2 }')"
            current="$(awk -v image="$service" '$1 == image { print $2 }' images/image-digests.lock)"
            [[ ! "$current" =~ ^sha256:[0-9a-f]{64}$ || "$previous" == "$current" ]]
          }
          dependencies=(base/go-builder base/runtime-min infra/postgres)
          for dependency in "${dependencies[@]}"; do
            previous_digest="$(git show "$base:images/image-digests.lock" 2>/dev/null | awk -v image="$dependency" '$1 == image { print $2 }')"
            current_digest="$(awk -v image="$dependency" '$1 == image { print $2 }' images/image-digests.lock)"
            if [[ ! "$current_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              case "$dependency" in
                base/go-builder|base/runtime-min)
                  if [[ "$backend_required" == "true" || "$migrate_required" == "true" ]]; then
                    echo "images/image-digests.lock 缺少有效 $dependency digest" >&2
                    exit 1
                  fi
                  ;;
                infra/postgres)
                  if [[ "$cron_required" == "true" ]]; then
                    echo "images/image-digests.lock 缺少有效 $dependency digest" >&2
                    exit 1
                  fi
                  ;;
              esac
              continue
            fi
            if [[ "$previous_digest" != "$current_digest" ]]; then
              case "$dependency" in
                base/go-builder)
                  if service_digest_stale service/backend; then backend_required=true; fi
                  if service_digest_stale service/migrate; then migrate_required=true; fi
                  if service_digest_stale service/cron; then cron_required=true; fi
                  ;;
                base/runtime-min)
                  if service_digest_stale service/backend; then backend_required=true; fi
                  if service_digest_stale service/migrate; then migrate_required=true; fi
                  ;;
                infra/postgres)
                  if service_digest_stale service/cron; then cron_required=true; fi
                  ;;
              esac
            fi
          done
          required=false
          if [[ "$backend_required" == "true" || "$migrate_required" == "true" || "$cron_required" == "true" ]]; then
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "backend_required=$backend_required" >> "$GITHUB_OUTPUT"
          echo "migrate_required=$migrate_required" >> "$GITHUB_OUTPUT"
          echo "cron_required=$cron_required" >> "$GITHUB_OUTPUT"

  lint-test:
    needs: detect-image-build
    if: needs.detect-image-build.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: 静态检查(go vet + golangci-lint)
        working-directory: backend
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      - name: 源码安全扫描(gosec + govulncheck)
        working-directory: backend
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -nosec=false -severity low -confidence low -exclude-generated ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: 后端构建与仓库内测试
        working-directory: backend
        run: go test ./... -race -count=1
      - name: 性能基准回归门禁
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi

          benchmark_base="$RUNNER_TEMP/chaimir-benchmark-base"
          git worktree add --detach "$benchmark_base" "$base"
          trap 'git worktree remove --force "$benchmark_base"' EXIT
          for source in \
            pkg/chainassert/chainassert_benchmark_test.go \
            pkg/crypto/hash_benchmark_test.go \
            pkg/snowflake/snowflake_benchmark_test.go; do
            install -D "$source" "$benchmark_base/backend/$source"
          done

          benchmark_packages=(./pkg/chainassert ./pkg/crypto ./pkg/snowflake)
          benchmark_args=(-run '^$' -bench '^Benchmark' -benchmem -count=6 -benchtime=500ms)
          (
            cd "$benchmark_base/backend"
            go test "${benchmark_packages[@]}" "${benchmark_args[@]}"
          ) | tee benchmark-base.txt
          go test "${benchmark_packages[@]}" "${benchmark_args[@]}" | tee benchmark-current.txt

          benchstat_version='v0.0.0-20260819171926-ebcb4798430d'
          go run "golang.org/x/perf/cmd/benchstat@$benchstat_version" benchmark-base.txt benchmark-current.txt | tee benchmark-comparison.txt
          go run "golang.org/x/perf/cmd/benchstat@$benchstat_version" -format csv benchmark-base.txt benchmark-current.txt > benchmark-comparison.csv

          awk -F, \
            -v sec_limit="$BENCHMARK_MAX_SEC_OP_REGRESSION_PERCENT" \
            -v bytes_limit="$BENCHMARK_MAX_BYTES_OP_REGRESSION_PERCENT" \
            -v allocs_limit="$BENCHMARK_MAX_ALLOCS_OP_REGRESSION_PERCENT" '
            $2 == "sec/op" || $2 == "B/op" || $2 == "allocs/op" { metric=$2; next }
            $1 == "" || $1 == "geomean" || $6 == "~" || $6 == "" { next }
            $6 ~ /^\+/ {
              delta=$6
              gsub(/[+%]/, "", delta)
              limit=(metric == "sec/op" ? sec_limit : (metric == "B/op" ? bytes_limit : allocs_limit))
              if ((delta + 0) > limit) {
                printf "性能回归超限: %s %s %s (阈值 %s%%)\n", $1, metric, $6, limit > "/dev/stderr"
                failed=1
              }
            }
            END { exit failed }
          ' benchmark-comparison.csv
      - name: 上传性能基准结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-benchmark-${{ github.sha }}
          path: |
            backend/benchmark-base.txt
            backend/benchmark-current.txt
            backend/benchmark-comparison.txt
            backend/benchmark-comparison.csv
      - name: 全仓源码契约审查
        run: node scripts/audit/index.mjs --source-only

  build-push:
    # 仅 main 推送且测试通过后构建推送(PR 只验证不推送)。
    needs: [detect-image-build, lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-image-build.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: 构建+扫描+签名+推送(backend)
        id: backend-image
        if: needs.detect-image-build.outputs.backend_required == 'true'
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/backend
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/backend/Dockerfile
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 构建+扫描+签名+推送(migrate)
        id: migrate-image
        if: needs.detect-image-build.outputs.migrate_required == 'true'
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/migrate
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/migrate/Dockerfile
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 构建+扫描+签名+推送(cron)
        id: cron-image
        if: needs.detect-image-build.outputs.cron_required == 'true'
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.HARBOR_REGISTRY }}/service/cron
          tag: ${{ github.sha }}
          context: .
          dockerfile: images/service/cron/Dockerfile
          registry: ${{ secrets.HARBOR_REGISTRY }}
          registry-username: ${{ secrets.HARBOR_USERNAME }}
          registry-password: ${{ secrets.HARBOR_PASSWORD }}
          cosign-key: ${{ secrets.COSIGN_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
      - name: 写入后端服务 digest 片段
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-digest-artifacts
          if [[ "${{ needs.detect-image-build.outputs.backend_required }}" == "true" ]]; then
            printf '%s %s\n' 'service/backend' '${{ steps.backend-image.outputs.digest }}' > image-digest-artifacts/service-backend.lock
          fi
          if [[ "${{ needs.detect-image-build.outputs.migrate_required }}" == "true" ]]; then
            printf '%s %s\n' 'service/migrate' '${{ steps.migrate-image.outputs.digest }}' > image-digest-artifacts/service-migrate.lock
          fi
          if [[ "${{ needs.detect-image-build.outputs.cron_required }}" == "true" ]]; then
            printf '%s %s\n' 'service/cron' '${{ steps.cron-image.outputs.digest }}' > image-digest-artifacts/service-cron.lock
          fi
      - name: 上传后端服务 digest 片段
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-backend-services
          path: image-digest-artifacts/*.lock
