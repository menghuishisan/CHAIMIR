name: image-build-wave

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      download-candidates:
        type: boolean
        default: false
    secrets:
      registry:
        required: true
      registry-username:
        required: true
      registry-password:
        required: true
      cosign-key:
        required: true
      cosign-password:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: 下载已验证的上游镜像 digest
        if: inputs.download-candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-digest-*
          path: image-input-digests
          merge-multiple: true
      - name: 构建、扫描、签名和推送
        id: build
        uses: ./deploy/ci/build-scan-sign-push
        with:
          image: ${{ secrets.registry }}/${{ matrix.logical }}
          tag: ${{ github.sha }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          candidate-locks: ${{ inputs.download-candidates && 'image-input-digests' || '' }}
          required-candidates: ${{ matrix.required_candidates }}
          registry: ${{ secrets.registry }}
          registry-username: ${{ secrets.registry-username }}
          registry-password: ${{ secrets.registry-password }}
          cosign-key: ${{ secrets.cosign-key }}
          cosign-password: ${{ secrets.cosign-password }}
      - name: 写入镜像 digest 片段
        env:
          IMAGE: ${{ matrix.logical }}
          SAFE_NAME: ${{ matrix.safe }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-digest-artifacts
          printf '%s %s\n' "$IMAGE" "$DIGEST" > "image-digest-artifacts/$SAFE_NAME.lock"
      - name: 上传镜像 digest 片段
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-digest-${{ matrix.safe }}
          path: image-digest-artifacts/${{ matrix.safe }}.lock
          if-no-files-found: error
